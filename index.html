<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>College IPL Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&family=Sofia+Sans+Extra+Condensed:wght@500;600;700;800;900&family=Sofia+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: green outfield rail | control room (player · bid · teams) over a dock (queue · feed).
     Palette from the Figma "Web Design" page; mystery/wild/sold hues added per the brief. */
  --navy:#080D24;            /* Homepage frame */
  --navy-2:#0E1532;
  --navy-3:#162045;
  --navy-4:#1F2B57;
  --line:rgba(219,209,198,.13);
  --line-2:rgba(219,209,198,.26);
  --sand:#DBD1C6;            /* Sidebar frame */
  --paper:#F5F5F5;           /* Timer box, profile circle */
  --grey:#D9D9D9;            /* Wireframe cards */
  --red:#FD4B4B;             /* BID button */
  --blue:#368BDA;            /* RTM button */
  --taupe:rgba(91,71,71,.49);/* PASS button */
  --green:#9DDD90;           /* Sidebar gradient, top */
  --green-2:#5D7248;         /* Sidebar gradient, bottom */
  --gold:#F8D57E;            /* SOLD (kit accent "Sweet Corn") */
  --purple:#A98BFF;          /* Mystery */
  --orange:#FF8A3D;          /* Wild card */
  --ink:#F5F5F5;
  --muted:#ABA49D;
  --faint:#6F6E7E;
  --f-display:'Bayon','Sofia Sans Extra Condensed',Impact,'Arial Narrow',sans-serif;
  --f-cond:'Sofia Sans Extra Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --f-body:'Sofia Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:11px;
  --r-lg:20px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%}
h1,h2,h3,h4{margin:0;text-wrap:balance}
table{border-collapse:collapse}
.num,.tab{font-variant-numeric:tabular-nums}
kbd{font:700 11px/1 var(--f-body);padding:3px 5px;border-radius:5px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);color:inherit;opacity:.85;letter-spacing:0;white-space:nowrap}
.lbl{font:700 13px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--sand);opacity:.78}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr);height:100%}
.rail{grid-row:1/3;background:linear-gradient(180deg,var(--green),var(--green-2));color:var(--navy);display:flex;flex-direction:column;gap:4px;padding:10px 8px 12px;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 10px}
.brand svg{width:44px;height:44px}
.brand span{font:15px/1 var(--f-display);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border:0;border-radius:12px;background:transparent;color:var(--navy);font:14px/1 var(--f-display);letter-spacing:.03em}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(8,13,36,.12)}
.nav.on{background:var(--navy);color:var(--green)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.pages{min-height:0;min-width:0;position:relative}
.page{height:100%;overflow:auto;min-width:0}
.page.control{overflow:hidden}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);min-width:0;background:var(--navy)}
.tb-event{display:flex;align-items:center;gap:10px;min-width:0}
.tb-name{font:22px/1 var(--f-display);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:3px}
.tb-set{display:flex;align-items:baseline;gap:10px;font:700 16px/1 var(--f-cond);letter-spacing:.06em;white-space:nowrap;min-width:0}
.tb-set b{color:var(--gold);font-weight:800}
.tb-set span{color:var(--muted)}
.tb-count{display:flex;gap:14px;font:600 14px/1 var(--f-cond);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.tb-count b{color:var(--ink);font-size:17px;font-weight:800}
.tb-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tb-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:transparent;border-radius:9px;padding:6px 10px;font:700 14px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tb-btn:hover{background:var(--navy-3)}
.save{display:inline-flex;align-items:center;gap:6px;font:600 13px/1.1 var(--f-cond);letter-spacing:.05em;padding:6px 10px;border-radius:9px;background:rgba(157,221,144,.1);color:var(--green);white-space:nowrap}
.save.bad{background:rgba(253,75,75,.15);color:var(--red)}
.save.ro{background:rgba(54,139,218,.15);color:var(--blue)}
.save small{color:var(--muted);font-weight:500}
.pill{border:0;border-radius:999px;padding:4px 10px;font:800 12px/1 var(--f-cond);letter-spacing:.12em}
.pill.sample{background:var(--sand);color:var(--navy)}

/* ---------- Generic controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;background:var(--navy-3);color:var(--ink);font:800 16px/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;transition:filter .12s,transform .06s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn.lg{padding:14px 22px;font-size:20px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:var(--navy)}
.btn.taupe{background:var(--taupe);color:#fff}
.btn.purple{background:var(--purple);color:var(--navy)}
.btn.wild{background:var(--orange);color:var(--navy)}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.ghost:hover{background:var(--navy-3)}
.btn.line-red{background:transparent;border-color:rgba(253,75,75,.6);color:var(--red)}
.btn.line-purple{background:rgba(169,139,255,.08);border-color:rgba(169,139,255,.55);color:var(--purple)}
.mini{border:1px solid var(--line-2);background:transparent;border-radius:7px;padding:4px 8px;font:700 12px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--sand);white-space:nowrap}
.mini:hover{background:var(--navy-3)}
.mini.on{background:var(--sand);color:var(--navy);border-color:var(--sand)}
.icon-btn{border:0;background:transparent;border-radius:6px;padding:3px 6px;color:var(--muted);font-size:14px;line-height:1}
.icon-btn:hover{background:var(--navy-4);color:var(--ink)}
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{background:var(--navy);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:var(--navy)}
label.f{display:flex;flex-direction:column;gap:5px;font:700 12px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
label.f > span small{letter-spacing:0;text-transform:none;font:500 12px var(--f-body);color:var(--muted)}
label.f input,label.f select,label.f textarea{font:500 15px var(--f-body);letter-spacing:0;text-transform:none}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 11px;font:700 13px/1 var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--sand);white-space:nowrap}
.fchip.on{background:var(--sand);color:var(--navy);border-color:var(--sand)}
.fchip .n{opacity:.6;margin-left:3px}
.muted{color:var(--muted)}
.bad{color:var(--red)}
.warn{color:var(--gold)}
.good{color:var(--green)}
.empty-note{color:var(--muted);padding:18px;text-align:center}

/* status pills */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font:800 12px/1 var(--f-cond);letter-spacing:.09em;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.available{color:var(--green);background:rgba(157,221,144,.1)}
.st.current{color:var(--gold);background:rgba(248,213,126,.12)}
.st.sold{color:var(--blue);background:rgba(54,139,218,.14)}
.st.unsold{color:var(--red);background:rgba(253,75,75,.12)}
.st.mystery{color:var(--purple);background:rgba(169,139,255,.12)}
.st.wild{color:var(--orange);background:rgba(255,138,61,.12)}
.st.withdrawn{color:#9a98a8;background:rgba(255,255,255,.06)}
.st.withdrawn::before{background:#000;border:1px solid #9a98a8}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:4px 8px;background:var(--navy-4);font:700 13px/1.1 var(--f-cond);letter-spacing:.04em;white-space:nowrap}
.tbadge{display:inline-flex;align-items:center;gap:7px;font-weight:800;min-width:0}
.tbadge .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.tbadge span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* photos & logos */
.ph{position:relative;display:grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--rc,#368BDA) 70%,#fff 10%),color-mix(in srgb,var(--rc,#368BDA) 45%,var(--navy)));color:var(--navy);font:30px/1 var(--f-display);letter-spacing:.02em;box-shadow:0 0 0 4px var(--paper)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.xs{width:28px;height:28px;font-size:12px;box-shadow:0 0 0 2px var(--paper)}
.ph.sm{width:40px;height:40px;font-size:16px;box-shadow:0 0 0 2px var(--paper)}
.ph.md{width:84px;height:84px;font-size:30px}
.ph.lg{width:132px;height:132px;font-size:46px}
.ph.mys{background:radial-gradient(circle at 50% 35%,#6b4fd8,#1d1450);color:var(--purple);font-family:var(--f-display)}
.logo{display:grid;place-items:center;flex:none;border-radius:10px;background:var(--tc);color:var(--on,#fff);font:800 14px/1 var(--f-cond);letter-spacing:.04em;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:var(--paper)}
.logo.sm{width:34px;height:34px}
.logo.md{width:52px;height:52px;font-size:18px;border-radius:12px}
.logo.lg{width:72px;height:72px;font-size:24px;border-radius:14px}

/* ---------- Control room ---------- */
.cr{display:grid;height:100%;grid-template-columns:minmax(250px,.95fr) minmax(420px,1.45fr) minmax(270px,1fr);grid-template-rows:minmax(0,1fr) minmax(190px,31%);gap:10px;padding:10px 16px 12px;position:relative}
.panel{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.cr-player{grid-column:1;grid-row:1;overflow-y:auto}
.cr-bid{grid-column:2;grid-row:1;overflow-y:auto}
.cr-teams{grid-column:3;grid-row:1}
.cr-dock{grid-column:1/4;grid-row:2;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr);gap:10px;min-height:0}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.ph-head h3{font:800 15px/1 var(--f-cond);letter-spacing:.14em;color:var(--sand)}
.ph-head h3 span{color:var(--muted);font-weight:600;letter-spacing:.06em;margin-left:6px}
.ph-head .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* player card */
.pcard{padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);--k:var(--gold)}
.pcard.k-mystery{--k:var(--purple);background:linear-gradient(180deg,rgba(169,139,255,.13),transparent 70%)}
.pcard.k-wild{--k:var(--orange);background:linear-gradient(180deg,rgba(255,138,61,.13),transparent 70%)}
.pc-set{display:flex;justify-content:space-between;gap:8px;font:800 14px/1.1 var(--f-cond);letter-spacing:.1em;color:var(--sand)}
.pc-set span{color:var(--muted);font-weight:600;white-space:nowrap}
.pc-head{display:flex;gap:16px;align-items:center}
.pc-ident{min-width:0;display:flex;flex-direction:column;gap:6px}
.pc-id{font:800 14px/1 var(--f-cond);letter-spacing:.16em;color:var(--k)}
.pc-name{font:clamp(26px,2.3vw,40px)/.95 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.pc-badges{display:flex;flex-wrap:wrap;gap:5px}
.pc-badges .tag.k{background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--k)}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
.pc-meta div{min-width:0}
.pc-meta dt{font:700 12px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pc-meta dd{margin:0;font:700 17px/1.15 var(--f-cond);letter-spacing:.02em;overflow-wrap:anywhere}
.pc-meta .rating dd{font:800 26px/1 var(--f-cond);color:var(--gold)}
.pc-meta .base dd{font:800 22px/1 var(--f-cond)}
.pc-tags{display:flex;flex-wrap:wrap;gap:6px}
.peek{align-self:flex-start}
.qm{color:var(--purple);font-weight:900;letter-spacing:.08em}
.mys-box{border:1px dashed rgba(169,139,255,.5);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(169,139,255,.06)}
.clues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.clues li{font:700 16px/1.2 var(--f-cond);letter-spacing:.02em}
.clues li b{color:var(--purple);letter-spacing:.1em;margin-right:6px}
.clues li.new{animation:clueIn .5s ease}
@keyframes clueIn{from{opacity:0;transform:translateY(6px)}}
.mys-actions{display:flex;flex-wrap:wrap;gap:6px}
.cr-special{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cr-special .btn{min-width:0}
.cr-special .btn.wild span{overflow:hidden;text-overflow:ellipsis}
.cr-special .btn.wild{justify-content:space-between}
.cr-special small{font:600 13px var(--f-cond);opacity:.75;letter-spacing:.04em}
.ladder{padding:10px 14px 12px}
.ladder h3{display:flex;justify-content:space-between;font:800 13px/1 var(--f-cond);letter-spacing:.14em;color:var(--sand);margin-bottom:8px}
.ladder h3 span{color:var(--muted)}
.ladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ladder li{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font:700 15px/1 var(--f-cond)}
.ladder li.top{background:rgba(248,213,126,.1);color:var(--gold)}
.ladder li .dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.ladder li .amt{font-weight:800;font-variant-numeric:tabular-nums}
.ladder li time{color:var(--muted);font:500 12px var(--f-body);font-variant-numeric:tabular-nums}
.ladder li.empty{display:block;color:var(--muted);font-weight:500}
.cr-empty{padding:28px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.cr-empty h2{font:30px/1 var(--f-display)}
.cr-empty p{margin:0;color:var(--muted);max-width:40ch}

/* bid panel */
.bp{display:flex;flex-direction:column;gap:12px;padding:14px 14px 12px;min-height:100%}
.bp-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,34%);gap:14px;align-items:stretch}
.bp-cur{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.bp-amt{font:900 clamp(54px,5.6vw,96px)/.9 var(--f-cond);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bp.ready .bp-amt{color:var(--sand)}
.bp-amt.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.05);color:var(--gold)}}
.bp-lead{font:800 22px/1.1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;min-width:0}
.bp-lead .tbadge .dot{width:16px;height:16px}
.bp-lead small{display:block;font:600 14px var(--f-cond);color:var(--muted);letter-spacing:.06em;margin-top:2px}
.timer{border:0;border-radius:var(--r-lg);background:var(--paper);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;position:relative;overflow:hidden;min-height:118px}
.timer .lbl{color:var(--navy);opacity:.7}
.timer .t{font:900 clamp(40px,3.6vw,62px)/1 var(--f-cond);font-variant-numeric:tabular-nums}
.timer .bar{position:absolute;left:0;bottom:0;height:6px;background:var(--green-2);width:100%;transform-origin:left;transition:transform .25s linear}
.timer .sub{font:700 12px/1 var(--f-cond);letter-spacing:.1em;opacity:.6}
.timer.low{background:#ffe4e4}
.timer.low .t{color:#c81e1e}
.timer.low .bar{background:var(--red)}
.timer.up{background:var(--red);color:#fff;animation:pulse 1s infinite}
.timer.up .lbl{color:#fff}
.timer.paused .t{opacity:.45}
.timer.off{opacity:.5}
@keyframes pulse{50%{filter:brightness(1.18)}}
.bp-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bp-info div{background:var(--navy-3);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.bp-info span{font:700 12px/1 var(--f-cond);letter-spacing:.13em;color:var(--muted)}
.bp-info b{font:800 19px/1.05 var(--f-cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.bp-info b.next{color:var(--green)}
.bp-info small{font:600 12px/1 var(--f-cond);letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-info small b{font-size:12px;color:var(--ink)}
.bp-jumps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jump{border:1px solid var(--line-2);background:var(--navy-3);border-radius:9px;padding:9px 12px;font:800 17px/1 var(--f-cond);letter-spacing:.03em;white-space:nowrap}
.jump:hover{background:var(--navy-4)}
.jump.on{background:var(--green);color:var(--navy);border-color:var(--green)}
.jump:disabled{opacity:.4;cursor:not-allowed}
.space-hint{margin-left:auto;font:700 13px/1.2 var(--f-cond);letter-spacing:.06em;color:var(--muted);text-align:right}
.space-hint b{color:var(--ink)}
.bp-start{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bp-start .btn.lg{flex:1}
.bp-start p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.bp-teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;border:1px solid var(--line-2);border-top:5px solid var(--tc);border-radius:10px;background:var(--navy-3);padding:7px 8px 6px;text-align:left}
.chip:hover{background:var(--navy-4)}
.chip kbd{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 4px}
.chip .c-short{font:900 20px/1 var(--f-cond);letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .c-purse{font:700 13px/1 var(--f-cond);color:var(--sand);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .c-reason{font:800 11px/1 var(--f-cond);letter-spacing:.08em;min-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.s-lead{background:color-mix(in srgb,var(--tc) 22%,var(--navy-3));border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.chip.s-lead .c-reason{color:var(--gold)}
.chip.s-blocked{opacity:.45}
.chip.s-blocked .c-reason{color:var(--red)}
.chip.s-passed{opacity:.5;background:repeating-linear-gradient(135deg,var(--navy-3) 0 8px,var(--navy-2) 8px 16px)}
.chip.s-passed .c-reason{color:var(--muted)}
.chip.s-warn .c-reason{color:var(--gold)}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bp-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:8px;margin-top:auto;position:sticky;bottom:0;z-index:2;background:var(--navy-2);padding-top:8px;box-shadow:0 -10px 14px -8px var(--navy-2)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:70px;border:0;border-radius:var(--r);font:900 21px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap}
.act kbd{font-size:11px}
.act:hover{filter:brightness(1.12)}
.act:disabled{opacity:.4;cursor:not-allowed;filter:none}
.act.undo{background:var(--navy-4)}
.act.pass{background:var(--taupe)}
.act.rtm{background:var(--blue)}
.act.unsold{background:var(--red)}
.act.sold{background:var(--gold);color:var(--navy);font-size:28px}
.act.sold.hot{animation:pulse .8s infinite;box-shadow:0 0 0 3px #fff inset}
.bp-done{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:8px 0}
.bp-done .big{font:900 48px/1 var(--f-cond)}
.cr-fx{grid-column:2;grid-row:1;align-self:start;z-index:5;pointer-events:none;margin:8px;border-radius:14px;overflow:hidden;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.cr-fx.on{opacity:1;transform:none}

/* teams column */
.trows{overflow-y:auto;min-height:0;padding:6px;display:flex;flex-direction:column;gap:4px;flex:1}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:1px solid transparent;border-left:4px solid var(--tc);border-radius:9px;background:var(--navy-3);padding:6px 9px;text-align:left}
.trow:hover{background:var(--navy-4)}
.trow.lead{border-color:var(--gold);border-left-color:var(--tc);background:color-mix(in srgb,var(--gold) 10%,var(--navy-3))}
.tr-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tr-name{font:800 16px/1.05 var(--f-cond);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-sub{font:500 12px/1.1 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-warn{font:800 11px/1.1 var(--f-cond);letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-warn.bad{color:var(--red)}
.tr-warn.warn{color:var(--gold)}
.tr-purse{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tr-purse b{font:800 19px/1 var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr-purse small{font:500 11px var(--f-body);color:var(--muted);white-space:nowrap}
.tr-purse b.low{color:var(--red)}

/* dock */
.qlist{list-style:none;margin:0;padding:6px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:3px;flex:1}
.qi{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 6px 5px 8px;border-radius:8px;background:var(--navy-3);border:1px solid transparent}
.qi .qk{font:800 11px/1 var(--f-cond);letter-spacing:.1em;color:var(--muted);width:56px}
.qi .qid{font:800 14px/1 var(--f-cond);color:var(--sand);font-variant-numeric:tabular-nums}
.qi .qn{min-width:0;font:700 15px/1.1 var(--f-cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .qn small{font:500 12px var(--f-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.qi .qa{display:flex;gap:1px;opacity:.75}
.qi:hover .qa{opacity:1}
.qi.cur{background:rgba(248,213,126,.12);border-color:rgba(248,213,126,.35)}
.qi.cur .qk{color:var(--gold)}
.qi.nx{background:rgba(157,221,144,.08);border-color:rgba(157,221,144,.3)}
.qi.nx .qk{color:var(--green)}
.qi[draggable=true]{cursor:grab}
.qi.dragging{opacity:.4}
.qi.over-top{box-shadow:0 -3px 0 var(--gold)}
.qi.over-bot{box-shadow:0 3px 0 var(--gold)}
.qi .k-m{color:var(--purple)}
.qi .k-w{color:var(--orange)}
.dock-right{display:flex;flex-direction:column}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;border-bottom:3px solid transparent;padding:8px 11px 7px;font:800 14px/1 var(--f-cond);letter-spacing:.11em;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button .n{display:inline-block;margin-left:4px;background:var(--red);color:#fff;border-radius:999px;padding:1px 6px;font-size:11px;letter-spacing:0}
.dock-tools{display:flex;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.dock-tools:empty{display:none}
.dock-tools input[type=search]{flex:1 1 180px;padding:6px 10px}
.dock-body{overflow-y:auto;min-height:0;flex:1}
.feed{list-style:none;margin:0;padding:4px 8px}
.fe{display:grid;grid-template-columns:44px 22px minmax(0,1fr) minmax(0,auto) auto;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid rgba(219,209,198,.06);font:600 15px/1.2 var(--f-cond);letter-spacing:.02em}
.fe time{color:var(--muted);font:500 12px var(--f-body);font-variant-numeric:tabular-nums}
.fe-ic{text-align:center}
.fe-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fe-txt b{font-weight:800;font-variant-numeric:tabular-nums}
.fe-p{color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch;text-align:right}
.fe-void{font:800 10px/1 var(--f-cond);letter-spacing:.1em;color:var(--red);border:1px solid currentColor;border-radius:4px;padding:2px 4px}
.fe.void .fe-txt,.fe.void .fe-p{text-decoration:line-through;opacity:.5}
.fe.t-sold,.fe.t-rtm{background:rgba(248,213,126,.08);color:var(--gold)}
.fe.t-unsold{color:var(--red)}
.fe.t-wild{color:var(--orange)}
.fe.t-reveal,.fe.t-clue{color:var(--purple)}
.fe.t-correction,.fe.t-undo,.fe.t-restore,.fe.t-direct{color:var(--blue)}
.fe.t-pass,.fe.t-start,.fe.t-skip{color:var(--muted);font-size:14px}
.fe.t-alert{color:var(--sand)}
.fe .tbadge{font-weight:800}
.fe-more{padding:10px;text-align:center}

/* tables */
.table-wrap{overflow-x:auto;min-width:0}
.tbl{width:100%;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--navy-2);text-align:left;font:800 12px/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap;z-index:1}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr:hover td{background:rgba(255,255,255,.025)}
.tbl .pname{font:700 16px/1.1 var(--f-cond);letter-spacing:.02em}
.tbl .pid{font:800 13px var(--f-cond);color:var(--sand);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .money{font:800 15px var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .acts{display:flex;gap:2px;justify-content:flex-end}
.tbl tr.is-cur td{background:rgba(248,213,126,.07)}

/* stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:10px}
.stat{background:var(--navy-3);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat > span{font:700 12px/1.1 var(--f-cond);letter-spacing:.11em;color:var(--muted);text-transform:uppercase}
.stat > b{font:800 22px/1.05 var(--f-cond);letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat > small{color:var(--sand);font-size:13px;overflow-wrap:anywhere}

/* ---------- Pages ---------- */
.pg{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:1500px}
.pg-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pg-head h1{font:40px/1 var(--f-display);letter-spacing:.02em}
.pg-head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.pg-actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card > h2{font:800 20px/1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.card > h2 small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.card p{margin:0 0 10px;color:var(--muted);max-width:75ch}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{border:1px solid var(--line-2);background:transparent;border-radius:10px;padding:9px 14px;font:800 15px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--sand)}
.subtabs button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.pl-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pl-tools input[type=search]{flex:1 1 240px}
.bulkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy-3);border-radius:10px;padding:8px 12px}
.team-edit{display:grid;grid-template-columns:28px 56px 50px minmax(140px,2fr) 80px minmax(120px,1.4fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.team-edit .ix{font:800 15px var(--f-cond);color:var(--muted)}
.logo-up{position:relative;display:block;cursor:pointer}
.logo-up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--navy-3);width:40px;height:40px;font:800 20px/1 var(--f-cond)}
.stepper b{min-width:54px;text-align:center;font:800 22px/1 var(--f-cond)}
.role-grid{display:grid;grid-template-columns:auto repeat(2,90px);gap:8px 12px;align-items:center}
.role-grid > span{font:700 15px var(--f-cond);letter-spacing:.04em}
.role-grid > b{font:800 12px var(--f-cond);letter-spacing:.12em;color:var(--muted)}
.set-row{display:grid;grid-template-columns:auto 64px minmax(160px,1fr) 70px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.set-row .no{font:800 15px var(--f-cond);color:var(--gold)}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{color:var(--ink)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.tcard{background:var(--navy-2);border:1px solid var(--line);border-top:6px solid var(--tc);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tcard header{display:flex;align-items:center;gap:12px;min-width:0}
.tcard header > div{min-width:0;flex:1}
.tcard h3{font:24px/1 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.tcard header small{color:var(--muted);font-size:13px}
.tc-code{font:900 14px var(--f-cond);letter-spacing:.1em;color:var(--sand);border:1px solid var(--line-2);border-radius:6px;padding:3px 6px}
.tc-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc-kpis .k{background:var(--navy-3);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.tc-kpis span{font:700 11px/1 var(--f-cond);letter-spacing:.12em;color:var(--muted)}
.tc-kpis b{font:800 20px/1 var(--f-cond);font-variant-numeric:tabular-nums}
.tc-kpis .k.big{grid-column:1/-1}
.tc-kpis .k.big b{font-size:36px;color:var(--green)}
.tc-kpis .k.big b.low{color:var(--red)}
.tc-comp h4,.tc-bal h4,.tc-squad h4{font:800 12px/1 var(--f-cond);letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.tc-comp ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font:700 15px/1.2 var(--f-cond)}
.tc-comp li{display:flex;justify-content:space-between;gap:6px}
.tc-comp li b{font-variant-numeric:tabular-nums}
.tc-comp li.short b{color:var(--red)}
.tc-buys{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.tc-buys span{display:block;font:700 11px var(--f-cond);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.tc-buys b{font:700 15px/1.15 var(--f-cond);letter-spacing:.02em}
.segbar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font:700 14px var(--f-cond);letter-spacing:.03em}
.segbar i{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.segbar i b{height:12px;border-radius:2px;background:rgba(255,255,255,.08)}
.segbar i b.on{background:var(--green)}
.segbar.mid i b.on{background:var(--gold)}
.segbar.lowv i b.on{background:var(--red)}
.segbar em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tc-bal{display:flex;flex-direction:column;gap:5px}
.warns{display:flex;flex-wrap:wrap;gap:5px}
.wchip{font:800 12px/1 var(--f-cond);letter-spacing:.07em;border-radius:6px;padding:5px 7px;background:rgba(248,213,126,.12);color:var(--gold)}
.wchip.bad{background:rgba(253,75,75,.14);color:var(--red)}
.wchip.ok{background:rgba(157,221,144,.12);color:var(--green)}
.squad{width:100%;font-size:14px}
.squad td{padding:4px 6px;border-bottom:1px solid var(--line)}
.squad td:last-child{text-align:right;font:800 15px var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.report{break-inside:avoid}
.metric{display:grid;grid-template-columns:170px 1fr 42px;gap:10px;align-items:center;font:700 14px var(--f-cond);letter-spacing:.04em}
.metric .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.metric .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green))}
.metric em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.export-tbl td{padding:7px 8px}
.export-tbl td:first-child{font:700 15px var(--f-cond);letter-spacing:.03em}
.export-tbl .row{justify-content:flex-end}
.score-in{width:64px;text-align:center;font:800 16px var(--f-cond)!important}
.hint{display:block;font:500 11px var(--f-body);color:var(--faint);text-align:center;margin-top:2px}
.total-cell{font:900 22px var(--f-cond);text-align:center;color:var(--gold)}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.award{background:var(--navy-3);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.award h3{font:800 18px/1.1 var(--f-cond);letter-spacing:.04em}
.award .sugg{font-size:13px;color:var(--muted)}
.ck-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto}
.ck-list li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--navy-3);border-radius:8px;padding:7px 10px}
.ck-list time{color:var(--muted);font:500 13px var(--f-body);font-variant-numeric:tabular-nums}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:14px}
.two-col > *{min-width:0}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(3,6,18,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--navy-2);border:1px solid var(--line-2);border-top:6px solid var(--mt,var(--sand));border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:mIn .16s ease}
.modal.wide{width:min(900px,100%)}
.modal.xwide{width:min(1100px,100%)}
@keyframes mIn{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal.tone-gold{--mt:var(--gold)}
.modal.tone-red{--mt:var(--red)}
.modal.tone-blue{--mt:var(--blue)}
.modal.tone-purple{--mt:var(--purple)}
.modal.tone-wild{--mt:var(--orange)}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px}
.modal header h2{font:30px/1 var(--f-display);letter-spacing:.02em;color:var(--mt,var(--ink))}
.modal .x{border:0;background:transparent;font-size:18px;color:var(--muted);border-radius:8px;padding:4px 8px}
.modal .x:hover{background:var(--navy-3);color:var(--ink)}
.m-body{padding:4px 18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.m-body p{margin:0;color:var(--sand)}
.modal footer{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sale-grid{display:grid;gap:10px}
.sale-grid > div{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy-3);border-radius:10px;padding:12px 14px}
.sale-grid span{font:700 13px var(--f-cond);letter-spacing:.14em;color:var(--muted)}
.sale-grid b{font:800 22px/1.1 var(--f-cond);letter-spacing:.03em;text-align:right;min-width:0;overflow-wrap:anywhere}
.sale-grid b.big{font-size:40px;color:var(--gold);font-weight:900}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.keys kbd{font-size:13px;padding:5px 8px;justify-self:start;opacity:1;background:var(--navy-4)}
.keys span{font-size:15px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.preset{border:1px solid var(--line-2);background:var(--navy-3);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:5px}
.preset:hover{background:var(--navy-4)}
.preset b{font:800 16px/1 var(--f-cond);letter-spacing:.06em}
.preset span{font:600 14px/1.2 var(--f-cond);color:var(--sand);letter-spacing:.02em}
.preset.sugg{border-color:var(--gold)}
.alert-prev{border-radius:12px;padding:14px;background:var(--navy);border:1px solid var(--line-2)}
.wd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wd-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--navy-3);border-radius:10px;padding:8px 10px}
.wd-list .nm{font:800 17px/1.1 var(--f-cond);letter-spacing:.03em;min-width:0}
.wd-list .nm small{display:block;font:500 13px var(--f-body);color:var(--muted);letter-spacing:0}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;background:rgba(248,213,126,.1);color:var(--gold)}
.notice.bad{background:rgba(253,75,75,.12);color:var(--red)}
.notice.info{background:rgba(54,139,218,.12);color:#9cc9f2}
.notice.ok{background:rgba(157,221,144,.1);color:var(--green)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(180px,100%),1fr));gap:12px}
.form-grid .span2{grid-column:span 2}
.form-grid .span-all{grid-column:1/-1}
.tagpick{display:flex;flex-wrap:wrap;gap:5px}
.tagpick button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 10px;font:700 13px/1 var(--f-cond);letter-spacing:.03em;color:var(--sand)}
.tagpick button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* toasts */
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{pointer-events:auto;background:var(--paper);color:var(--navy);border-radius:10px;padding:10px 16px;font:700 16px/1.25 var(--f-cond);letter-spacing:.03em;box-shadow:0 10px 30px rgba(0,0,0,.4);border-left:6px solid var(--blue);animation:tIn .18s ease;max-width:100%}
.toast.good{border-left-color:var(--green-2)}
.toast.warn{border-left-color:#e2a400}
.toast.bad{border-left-color:var(--red)}
@keyframes tIn{from{transform:translateY(10px);opacity:0}}
.lock{position:fixed;inset:0;z-index:90;background:rgba(3,6,18,.88);display:grid;place-items:center;padding:16px}
.lock .modal{border-top-color:var(--blue)}

/* ---------- Effects (shared) ---------- */
.fx{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.25em;padding:.8em 1em;color:var(--ink)}
.fx-sold{background:radial-gradient(ellipse at center,rgba(248,213,126,.3),rgba(8,13,36,.94) 70%)}
.fx-unsold{background:radial-gradient(ellipse at center,rgba(253,75,75,.28),rgba(8,13,36,.94) 70%)}
.fx-wild{background:radial-gradient(ellipse at center,rgba(255,138,61,.32),rgba(8,13,36,.95) 70%)}
.fx-reveal{background:radial-gradient(ellipse at center,rgba(169,139,255,.32),rgba(8,13,36,.95) 70%)}
.fx-set{background:linear-gradient(90deg,rgba(157,221,144,.2),rgba(8,13,36,.95))}
.fx-award{background:radial-gradient(ellipse at center,rgba(248,213,126,.28),rgba(8,13,36,.95) 70%)}
.fx-alert{background:var(--red);color:#fff}
.fx-alert.tone-gold{background:var(--gold);color:var(--navy)}
.fx-alert.tone-purple{background:#5b3fd0}
.fx-alert.tone-wild{background:var(--orange);color:var(--navy)}
.fx-alert.tone-blue{background:var(--blue)}
.fx-alert.tone-green{background:var(--green);color:var(--navy)}
.stamp{font:1em/1 var(--f-display);font-size:2.4em;letter-spacing:.04em;color:var(--gold);border:.08em solid currentColor;border-radius:.12em;padding:.12em .3em 0;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp.red{color:var(--red)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}}
.fx-name{font:1.6em/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.fx-to{font:800 1.05em/1.1 var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
.fx-amt{font:900 2em/1 var(--f-cond);color:var(--gold);font-variant-numeric:tabular-nums}
.fx-tag{font:800 .8em/1 var(--f-cond);letter-spacing:.14em;color:var(--blue);background:rgba(54,139,218,.16);border-radius:.3em;padding:.3em .5em}
.fx-k{font:800 .9em/1 var(--f-cond);letter-spacing:.2em}
.fx-wild .fx-k{color:var(--orange)}
.fx-reveal .fx-k{color:var(--purple)}
.fx-sub{font:800 1em/1.1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
.cd{position:relative;height:2.6em;width:3em}
.cd span{position:absolute;inset:0;display:grid;place-items:center;font:2.6em/1 var(--f-display);color:var(--orange);opacity:0;animation:cd 1s ease both}
.cd span:nth-child(2){animation-delay:1s}
.cd span:nth-child(3){animation-delay:2s}
@keyframes cd{0%{opacity:0;transform:scale(2)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.7)}}
.fx-wild .cd{animation:gone 0s 3s forwards}
@keyframes gone{to{height:0;opacity:0}}
.fx-late{opacity:0;animation:late .5s ease forwards;animation-delay:var(--d,3s);display:flex;flex-direction:column;align-items:center;gap:.25em}
@keyframes late{from{opacity:0;transform:translateY(.4em) scale(.96)}to{opacity:1;transform:none}}
.fx-meta{font:700 .85em/1.2 var(--f-cond);letter-spacing:.08em;color:var(--sand);text-transform:uppercase}
.fx-a-title{font:2em/1 var(--f-display);letter-spacing:.03em}
.fx-a-text{font:900 1.4em/1.08 var(--f-cond);letter-spacing:.02em;text-transform:uppercase;max-width:30ch}
.fx-alert{animation:alertIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes alertIn{from{transform:translateY(-30%);opacity:0}}
.fx-set small{font:800 .8em/1 var(--f-cond);letter-spacing:.2em;color:var(--green)}
.fx-set b{font:1.8em/1 var(--f-display);letter-spacing:.02em}
.fx-set span{color:var(--sand);font:700 .9em var(--f-cond);letter-spacing:.08em}
.fx-award .trophy{font-size:2.4em;line-height:1}
.fx-award small{font:800 .9em/1 var(--f-cond);letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.fx-award b{font:2em/1 var(--f-display)}
.fx-award span{font:800 1.1em var(--f-cond);letter-spacing:.06em}
.fx-award p{margin:0;color:var(--sand);font-size:.9em}
.fx .ph{box-shadow:0 0 0 .12em var(--paper)}
.cr-fx .fx{font-size:13px;padding:14px 12px;min-height:150px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cr-fx .fx:not(.fx-alert){background-color:#0E1532;border:1px solid var(--line-2)}
.cr-fx .fx-alert{min-height:0}

/* ---------- Projector ---------- */
.proj{position:fixed;inset:0;z-index:40;background:
  radial-gradient(ellipse 80% 55% at 50% -12%,rgba(157,221,144,.16),transparent 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 6vw,transparent 6vw 12vw),
  var(--navy);
  font-size:min(1.55vw,2.75vh);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.pj-top{display:flex;align-items:center;gap:1.2em;padding:.9em 1.6em .5em;font:800 1em/1 var(--f-cond);letter-spacing:.12em;text-transform:uppercase}
.pj-top .ev{font:1.35em/1 var(--f-display);letter-spacing:.04em;padding-top:.15em}
.pj-top .set{color:var(--gold)}
.pj-top .set span{color:var(--sand);margin-left:.6em}
.pj-top .live{margin-left:auto;display:flex;align-items:center;gap:.4em;color:var(--red)}
.pj-top .live::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.pj-main{min-height:0;padding:.4em 1.6em}
.pj-lot{height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6em;align-items:center;--k:var(--gold)}
.pj-lot.k-mystery{--k:var(--purple)}
.pj-lot.k-wild{--k:var(--orange)}
.pj-player{display:flex;flex-direction:column;gap:1em;min-width:0}
.pj-ph-row{display:flex;align-items:center;gap:1.4em;min-width:0}
.pj-player .ph{width:min(30vh,21vw);height:min(30vh,21vw);font-size:min(10vh,7vw);box-shadow:0 0 0 6px var(--paper),0 0 40px color-mix(in srgb,var(--k) 45%,transparent)}
.pj-ident{display:flex;flex-direction:column;gap:.45em;min-width:0}
.pj-id{font:800 1.15em/1 var(--f-cond);letter-spacing:.18em;color:var(--k)}
.pj-name{font:4.4em/.92 var(--f-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.pj-role{font:800 1.6em/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.pj-meta{display:flex;flex-wrap:wrap;gap:.5em 1.4em;font:700 1.15em/1.2 var(--f-cond);letter-spacing:.05em;color:var(--sand);text-transform:uppercase}
.pj-meta b{color:var(--ink);font-weight:800;margin-left:.3em}
.pj-meta .rt b{color:var(--gold);font-size:1.4em}
.pj-tags{display:flex;flex-wrap:wrap;gap:.4em}
.pj-tags .tag{font-size:1em;padding:.35em .6em;border-radius:.4em}
.pj-badges{display:flex;flex-wrap:wrap;gap:.4em}
.pj-badges .tag{font-size:.9em}
.pj-clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4em}
.pj-clues li{font:800 1.5em/1.15 var(--f-cond);letter-spacing:.02em}
.pj-clues li b{color:var(--purple);letter-spacing:.12em;margin-right:.4em;font-size:.75em}
.pj-bid{display:flex;flex-direction:column;gap:.6em;min-width:0;background:rgba(14,21,50,.7);border:1px solid var(--line);border-radius:1em;padding:1.2em 1.4em}
.pj-lbl{font:800 1.2em/1 var(--f-cond);letter-spacing:.2em;color:var(--sand)}
.pj-amt{font:900 7.6em/.86 var(--f-cond);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-amt.bump{animation:bump .4s ease}
.pj-team{display:flex;align-items:center;gap:.5em;font:800 2.2em/1 var(--f-cond);letter-spacing:.05em;text-transform:uppercase;min-width:0}
.pj-team .logo{width:2.6em;height:2.6em;font-size:.45em;border-radius:.5em}
.pj-team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-team.none{color:var(--muted);font-size:1.6em}
.pj-row{display:grid;grid-template-columns:1fr auto;gap:1em;align-items:center}
.pj-base{font:800 1.3em/1.2 var(--f-cond);letter-spacing:.06em;color:var(--sand)}
.pj-base b{color:var(--ink)}
.pj-timer{background:var(--paper);color:var(--navy);border-radius:.6em;padding:.25em .55em;font:900 3.2em/1 var(--f-cond);font-variant-numeric:tabular-nums;min-width:2.6em;text-align:center}
.pj-timer.low{color:#c81e1e}
.pj-timer.up{background:var(--red);color:#fff;animation:pulse 1s infinite}
.pj-timer.off{display:none}
.pj-idle{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2em;align-items:center}
.pj-idle h1{font:4em/.95 var(--f-display)}
.pj-idle ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5em}
.pj-idle li{display:flex;align-items:center;gap:.7em;font:800 1.6em/1.1 var(--f-cond);letter-spacing:.03em;text-transform:uppercase}
.pj-idle li small{color:var(--sand);font-size:.7em;letter-spacing:.1em}
.pj-hl{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.pj-hl div{background:rgba(14,21,50,.75);border:1px solid var(--line);border-radius:.7em;padding:.7em .9em;display:flex;flex-direction:column;gap:.25em}
.pj-hl span{font:800 .8em/1 var(--f-cond);letter-spacing:.14em;color:var(--muted)}
.pj-hl b{font:900 1.6em/1 var(--f-cond)}
.pj-hl small{color:var(--sand);font-size:.85em}
.pj-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:1em;padding:.6em 1.6em 1em;align-items:end}
.pj-feed{background:rgba(14,21,50,.75);border:1px solid var(--line);border-radius:.7em;padding:.5em .8em;min-width:0}
.pj-feed h4{font:800 .75em/1 var(--f-cond);letter-spacing:.2em;color:var(--red);margin-bottom:.4em}
.pj-feed ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.18em}
.pj-feed li{font:700 .95em/1.15 var(--f-cond);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-feed li time{color:var(--muted);margin-right:.5em;font-variant-numeric:tabular-nums}
.pj-feed li.sold{color:var(--gold)}
.pj-feed li.unsold{color:var(--red)}
.pj-feed li.wild{color:var(--orange)}
.pj-feed li.reveal{color:var(--purple)}
.pj-purses{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.4em,1fr));gap:.35em}
.pp{background:rgba(14,21,50,.8);border-top:.22em solid var(--tc);border-radius:.4em;padding:.35em .5em;display:flex;flex-direction:column;gap:.1em;min-width:0}
.pp b{font:900 1em/1 var(--f-cond);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp span{font:800 1.05em/1 var(--f-cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.pp small{font:600 .7em var(--f-cond);color:var(--muted);letter-spacing:.06em}
.pp.lead{background:color-mix(in srgb,var(--gold) 18%,rgba(14,21,50,.9))}
.pj-fx{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s}
.pj-fx.on{opacity:1}
.pj-fx .fx{width:100%;height:100%;font-size:1.6em}
.pj-fx .fx:not(.fx-alert){background-color:var(--navy)}
.pj-fx .ph.lg{width:24vh;height:24vh;font-size:8vh}
.pj-idle .ph.sm{width:2.4em;height:2.4em;font-size:.9em}
.pj-fx .fx-alert{height:auto;width:auto;max-width:90%;border-radius:.6em;padding:1em 2em;font-size:1.7em;box-shadow:0 1em 3em rgba(0,0,0,.5)}
.pj-fx.fx-alert-wrap{background:rgba(3,6,18,.55)}
.pj-hint{position:absolute;right:1em;bottom:.5em;font:600 .7em var(--f-body);color:var(--faint);transition:opacity .4s}
.proj.idle-mouse .pj-hint{opacity:0}
.proj.in-page{z-index:45}
body.mode-proj .app{display:none}

/* scramble */
[data-scramble]{font-variant-numeric:tabular-nums}

/* ---------- Responsive ---------- */
@media (max-height:880px) and (min-width:1241px){
  .cr{grid-template-rows:minmax(0,1fr) minmax(170px,27%);gap:8px;padding:8px 14px 10px}
  .bp{gap:9px;padding:11px 12px 10px}
  .bp-top{gap:10px}
  .bp-amt{font-size:clamp(48px,4.6vw,78px)}
  .bp-lead{font-size:19px}
  .timer{min-height:92px;padding:8px}
  .timer .t{font-size:clamp(34px,3vw,50px)}
  .bp-info div{padding:7px 10px;gap:4px}
  .bp-info b{font-size:17px}
  .jump{padding:7px 10px;font-size:15px}
  .chip{padding:5px 7px 4px;gap:2px;border-top-width:4px}
  .chip .c-short{font-size:17px}
  .act{min-height:54px;font-size:18px;gap:4px}
  .act.sold{font-size:23px}
  .pcard{padding:11px 12px 10px;gap:9px}
  .ph.lg{width:104px;height:104px;font-size:38px}
  .pc-meta dd{font-size:16px}
  .pc-meta .rating dd{font-size:23px}
  .trow{padding:5px 8px}
  .ph-head{padding:8px 12px 6px}
}
@media (max-width:1240px){
  .page.control{overflow:auto}
  .cr{height:auto;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-template-rows:auto auto auto}
  .cr-player{grid-column:1;grid-row:1;max-height:none}
  .cr-bid{grid-column:2;grid-row:1}
  .cr-teams{grid-column:1/3;grid-row:2;max-height:420px}
  .cr-dock{grid-column:1/3;grid-row:3;height:520px}
  .cr-fx{grid-column:2;grid-row:1}
  .tb-count{display:none}
}
@media (max-width:1100px){
  .tb-set{display:none}
  .save small{display:none}
}
@media (max-width:900px){
  .tb-btn span{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .rail{grid-row:auto;flex-direction:row;overflow-x:auto;padding:6px 8px;gap:2px}
  .brand{flex-direction:row;padding:0 6px 0 0}
  .brand svg{width:32px;height:32px}
  .brand span{display:none}
  .nav{padding:6px 8px;font-size:12px}
  .nav svg{width:20px;height:20px}
  .rail-foot{margin:0;flex-direction:row}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 16px;gap:8px}
  .tb-tools{margin-left:0;flex-wrap:wrap}
  .cr{grid-template-columns:minmax(0,1fr);padding:10px 16px}
  .cr-player,.cr-bid,.cr-teams,.cr-dock,.cr-fx{grid-column:1}
  .cr-player{grid-row:1}
  .cr-bid{grid-row:2}
  .cr-fx{grid-row:2}
  .cr-teams{grid-row:3}
  .cr-dock{grid-row:4;grid-template-columns:minmax(0,1fr);height:auto}
  .cr-dock .panel{max-height:460px}
  .bp-top{grid-template-columns:minmax(0,1fr)}
  .bp-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .act.sold{grid-column:1/-1}
  .bp-info{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pg{padding:16px}
  .team-edit{grid-template-columns:28px 56px 50px minmax(0,1fr);}
  .team-edit > :nth-child(n+5){grid-column:2/-1}
  .fe{grid-template-columns:40px 20px minmax(0,1fr) auto}
  .fe-p{display:none}
  .metric{grid-template-columns:120px 1fr 36px}
  .segbar{grid-template-columns:96px 1fr 30px}
  .two-col{grid-template-columns:minmax(0,1fr)}
  .form-grid .span2{grid-column:1/-1}
  .proj{font-size:2.6vw}
  .pj-lot,.pj-idle{grid-template-columns:minmax(0,1fr)}
  .pj-foot{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .fx-late{opacity:1}
  .cd{display:none}
}

/* ---------- Print (offline file) ---------- */
@media print{
  body{background:#fff;color:#000}
  .rail,.topbar,.no-print,.toasts{display:none!important}
  .app{display:block;height:auto}
  .page{overflow:visible;height:auto}
  .card,.tcard{background:#fff;color:#000;border-color:#bbb;break-inside:avoid}
  .muted,.tc-kpis span{color:#444}
}

<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <header class="topbar" id="topbar"></header>
  <main class="pages">
    <section class="page control" id="pg-control" data-page="control" aria-label="Control room">
      <div class="cr">
        <section class="panel cr-player" id="cr-player" aria-label="Player on the block"></section>
        <section class="panel cr-bid" id="cr-bid" aria-label="Bidding"></section>
        <section class="panel cr-teams" id="cr-teams" aria-label="Teams and purses"></section>
        <div class="cr-dock">
          <section class="panel" id="cr-queue" aria-label="Next players"></section>
          <section class="panel dock-right" aria-label="Live feed and lists">
            <div class="tabs" id="dockTabs" role="tablist"></div>
            <div class="dock-tools" id="dockTools"></div>
            <div class="dock-body" id="dockBody"></div>
          </section>
        </div>
        <div class="cr-fx" id="crFx" aria-live="polite"></div>
      </div>
    </section>
    <section class="page" id="pg-players" data-page="players" hidden></section>
    <section class="page" id="pg-teams" data-page="teams" hidden></section>
    <section class="page" id="pg-results" data-page="results" hidden></section>
    <section class="page" id="pg-judging" data-page="judging" hidden></section>
    <section class="page" id="pg-admin" data-page="admin" hidden></section>
    <section class="page" id="pg-setup" data-page="setup" hidden></section>
  </main>
</div>
<div id="proj" class="proj" hidden aria-label="Projector view"></div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="lock" class="lock" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px;color:#F5F5F5;background:#080D24">This auction control room needs JavaScript turned on.</p></noscript>
<script>
/* ---- 00-util.js ---- */
'use strict';
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 9) + (uid.n = (uid.n || 0) + 1).toString(36);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const pad2 = n => String(n).padStart(2, '0');
let CLOCK = null;                       // overridden while the sample auction is simulated
const NOW = () => (CLOCK != null ? CLOCK : Date.now());
const hhmm = t => { const d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const hhmmss = t => hhmm(t) + ':' + pad2(new Date(t).getSeconds());
const plural = (n, w, pl) => n + ' ' + (n === 1 ? w : (pl || w + 's'));

/* Money is stored as integer lakhs (100 = 1 Cr) so sums never drift. */
const cr2l = cr => Math.round(Number(cr) * 100);
function money(l, o = {}) {
  if (l == null || !isFinite(l)) return '—';
  const c = (typeof S !== 'undefined' && S && S.rules && S.rules.currency) || { sym: '₹', unit: 'Cr' };
  let sym = c.sym || '';
  if (o.pdf && sym === '₹') sym = 'Rs ';
  const v = Math.abs(l) / 100;

function simulateSample() {
  const rand = rng(20261002);
  SIM = true;
  const start = Date.now() - 72 * 60 * 1000;
  CLOCK = start;
  const tick = (a, b) => { CLOCK += Math.round((a + rand() * (b - a)) * 1000); };
  const ids = () => S.teams.map(t => t.id);
  const tidOf = code => S.teams.find(t => t.short === code).id;
  const greedy = { CC: 1.5, PK: 1.25, HH: 1.1 };
  const holdRTM = tidOf('BB');
  try {
    let guard = 0;
    if (!S.live.pid && S.queue.length) loadLotNow(S.queue[0]);
    while (S.live.pid && S.live.pid !== 'P047' && guard++ < 200) {
      const p = lotPlayer();
      tick(15, 40);
      startBidding();
      if (p.rating < 64 && rand() < 0.5) { tick(8, 16); markUnsold(true); tick(20, 40); continue; }
      const target = p.base + Math.round(1.25 * Math.pow(Math.max(0, p.rating - 62), 2) * (0.55 + rand() * 0.9));
      const pool = ids().filter(() => rand() < 0.45);
      while (pool.length < 2) { const x = ids()[Math.floor(rand() * S.teams.length)]; if (!pool.includes(x)) pool.push(x); }
      let n = 0;
      while (n++ < 60) {
        const amt = nextAmount();
        if (amt > target && S.live.bids.length) break;
        const lead = S.live.bids[S.live.bids.length - 1];
        const cands = pool.filter(t => (!lead || lead.tid !== t) && !checkBid(t, amt, p).hard.length);
        if (!cands.length) break;
        const weights = cands.map(t => greedy[T(t).short] || 1);
        let r = rand() * sum(weights), pick = cands[0];
        for (let k = 0; k < cands.length; k++) { r -= weights[k]; if (r <= 0) { pick = cands[k]; break; } }
        tick(4, 11);
        placeBid(pick, amt);
      }
      tick(5, 12);
      const lead = S.live.bids[S.live.bids.length - 1];
      if (!lead) { markUnsold(true); tick(20, 40); continue; }
      const rt = rtmOption(p, lead);
      if (rt && rt.tid !== holdRTM && rand() < 0.7) sell(rt.tid, lead.amt, 'rtm');
      else {
        if (rt) commit(() => log({ type: 'rtm_decline', pid: p.id, tid: rt.tid }));
        sell(lead.tid, lead.amt, 'auction');
      }
      tick(20, 45);
    }
    // P047 Arjun Rao: a live bidding war between Proxy Kings and Backbench Blasters.
    if (S.live.pid === 'P047') {
      tick(15, 25);
      startBidding();
      const war = [tidOf('PK'), tidOf('BB')];
      let k = 0;
      placeBid(tidOf('NO'), nextAmount()); tick(5, 9);
      while (nextAmount() <= cr2l(7.5)) { placeBid(war[k % 2 === 0 ? 0 : 1], nextAmount()); k++; tick(4, 9); if (k > 40) break; }
      const lt = S.live.bids[S.live.bids.length - 1];
      if (lt && lt.tid !== tidOf('PK')) placeBid(tidOf('PK'), nextAmount());
      commit(() => { S.live.passed = [tidOf('LL'), tidOf('NO')]; });
    }
  } finally {
    // shift the simulated clock so the last bid happened half a minute ago
    const delta = (Date.now() - 30000) - CLOCK;
    S.log.forEach(e => { e.t += delta; });
    S.lots.forEach(l => { l.t += delta; });
    S.live.bids.forEach(b => { b.t += delta; });
    if (S.live.startedAt) S.live.startedAt += delta;
    S.players.forEach(p => { if (p.soldAt) p.soldAt += delta; });
    SIM = false;
    CLOCK = null;
  }
  S.live.timer = S.rules.timer.on ? { endsAt: null, paused: true, left: 14000, dur: S.rules.timer.perBid * 1000 } : null;
  S.fx = null;
  S.rev = 1; S.updated = Date.now();
}

let DC = { rev: -1, s: null };
function D() {
  if (DC.rev === S.rev && DC.s === S) return DC;
  const pm = new Map(), tm = new Map(), sm = new Map();
  S.players.forEach(p => pm.set(p.id, p));
  S.teams.forEach(t => tm.set(t.id, t));
  S.sets.forEach((s, i) => sm.set(s.id, Object.assign({ no: i + 1 }, s)));
  DC = { rev: S.rev, s: S, pm, tm, sm, ti: {} };
  for (const t of S.teams) DC.ti[t.id] = computeTeam(t);
  DC.st = computeStats();
  return DC;
}
const P = id => (DC.s === S && DC.rev === S.rev ? DC.pm.get(id) : S.players.find(p => p.id === id));
const T = id => (DC.s === S && DC.rev === S.rev ? DC.tm.get(id) : S.teams.find(t => t.id === id));
const setOf = p => (p && p.setId ? S.sets.find(s => s.id === p.setId) : null);
const lotPlayer = () => (S.live.pid ? P(S.live.pid) : null);
const lead = () => S.live.bids[S.live.bids.length - 1] || null;
const tc = tid => (T(tid) || {}).color || '#888';

function bowlKindOf(txt) {
  const s = String(txt || '').toLowerCase();
  if (!s) return '';
  if (/(spin|off|leg|orthodox|chinaman|wrist|googly|break)/.test(s)) return 'spin';
  if (/(fast|medium|pace|seam|swing)/.test(s)) return 'pace';
  return '';
}
function parseRole(v) {
  const s = normKey(v);
  if (!s) return null;
  if (/^(wk|wicket|keeper|wicketkeeper|wkbat|wkbatter|wicketkeeperbatter|keeperbatter)/.test(s)) return 'WK';
  if (/^(ar|all|allrounder|allround)/.test(s)) return 'AR';
  if (/^(bowl|bowler|bwl|bow|pace|spin|fast|seam)/.test(s)) return 'BOWL';
  if (/^(bat|batter|batsman|batswoman|btr|opener)/.test(s)) return 'BAT';
  return null;
}
function pnum(p) {
  const m = String(p.id).match(/^[a-z]*0*(\d+)$/i);
  return m ? m[1].padStart(3, '0') : String(p.id);
}
function playerStatus(p) {
  if (S.live.pid === p.id && S.live.phase !== 'done' && p.status === 'available') return 'current';
  if (p.status === 'sold') return 'sold';
  if (p.status === 'unsold') return 'unsold';
  if (p.status === 'withdrawn') return 'withdrawn';
  if (p.wild) return 'wild';
  if (p.mystery) return 'mystery';
  return 'available';
}
const STATUS_LABEL = { available: 'AVAILABLE', current: 'CURRENT', sold: 'SOLD', unsold: 'UNSOLD', mystery: 'MYSTERY', wild: 'WILD CARD', withdrawn: 'WITHDRAWN' };
const statusPill = p => { const s = playerStatus(p); return `<span class="st ${s}">${STATUS_LABEL[s]}</span>`; };

/* Mystery visibility */
function isHiddenNow(p) {
  if (!p || !p.mystery || p.revealed) return false;
  if (S.live.pid === p.id) return !S.live.revealed;
  return p.status !== 'sold';
}
function hiddenFields(p) {

/* Prices */
function lotBase(p) {
  let b = p.base;
  if (p.wild && S.rules.wild.specialBase) b = S.rules.wild.base;
  if (p.round2 && S.rules.unsoldCut) b = Math.max(5, Math.round(b * (100 - S.rules.unsoldCut) / 100 / 5) * 5);
  return b;
}
function autoStep(cur) {
  for (const s of S.rules.slabs) if (s.upto == null || cur < s.upto) return s.step;
  return S.rules.slabs[S.rules.slabs.length - 1].step;
}
function nextAmount() {
  const p = lotPlayer(); if (!p) return 0;
  const l = lead();
  if (!l) return lotBase(p);
  return l.amt + (S.live.jump || autoStep(l.amt));
}
function findChallenger() {
  const b = S.live.bids, l = lead();
  if (!l) return null;
  for (let i = b.length - 2; i >= 0; i--) {
    const t = b[i].tid;
    if (t !== l.tid && !S.live.passed.includes(t)) return t;
  }
  return null;
}

/* Team summary */
function computeTeam(t) {
  const R = S.rules;
  const squad = S.players.filter(p => p.status === 'sold' && p.soldTo === t.id);
  const spent = sum(squad.map(p => p.soldPrice));
  const adj = sum((t.adjust || []).map(a => a.amt));
  const purse = R.purse + adj - spent;
  const roles = { BAT: 0, BOWL: 0, AR: 0, WK: 0 };
  squad.forEach(p => { roles[p.role] = (roles[p.role] || 0) + 1; });
  const overseas = squad.filter(p => p.overseas).length;
  const rtmUsed = squad.filter(p => p.acq === 'rtm').length;
  const count = squad.length;
  const sorted = squad.slice().sort((a, b) => b.soldPrice - a.soldPrice);
  const slotsLeft = Math.max(0, R.maxSquad - count);
  const need = {}; let needTotal = 0;
  for (const r of ROLES) { need[r] = Math.max(0, (R.roleMin[r] || 0) - roles[r]); needTotal += need[r]; }
  const reserveNow = R.reserve.mode === 'off' ? 0 : Math.max(0, R.minSquad - count - 1) * R.reserve.perSlot;
  const maxBid = Math.max(0, purse - reserveNow);
  const warn = [];
  if (count >= R.maxSquad) warn.push({ text: '❌ SQUAD FULL', tone: 'bad' });
  else if (slotsLeft <= 2) warn.push({ text: '⚠️ SQUAD ALMOST FULL', tone: 'warn' });
  if (purse <= 0 && count < R.maxSquad) warn.push({ text: '❌ NO PURSE LEFT', tone: 'bad' });
  else if (purse < R.lowPurse) warn.push({ text: '⚠️ LOW PURSE', tone: 'warn' });
  if (R.minSquad > count && purse < (R.minSquad - count) * R.reserve.perSlot) warn.push({ text: '💀 CANNOT AFFORD MINIMUM SQUAD', tone: 'bad' });
  if (overseas >= R.maxOverseas) warn.push({ text: '⚠️ OVERSEAS LIMIT REACHED', tone: 'warn' });
  if (needTotal && slotsLeft - needTotal <= 3) {
    for (const r of ['BOWL', 'WK', 'BAT', 'AR']) if (need[r]) warn.push({ text: `⚠️ MINIMUM ${r === 'WK' ? 'WICKETKEEPER' : ROLE_INFO[r].pl.toUpperCase()} NOT MET (${roles[r]}/${R.roleMin[r]})`, tone: slotsLeft - needTotal < 0 ? 'bad' : 'warn' });
  }
  return {
    id: t.id, squad, spent, purse, adj, roles, overseas, rtmUsed, rtmLeft: Math.max(0, R.rtmCount - rtmUsed), count, slotsLeft,
    need, needTotal, maxBid, warn, highest: sorted[0] || null, lowest: sorted[sorted.length - 1] || null, an: analyse(squad),
  };
}

/* Bid safety: hard reasons block a bid, soft reasons warn. */
function checkBid(tid, amt, p, o = {}) {
  const hard = [], soft = [];
  const R = S.rules, lv = S.live;
  const ti = D().ti[tid];
  if (!ti || !p) return { hard: ['Unknown team'], soft };
  const hid = isHiddenNow(p);
  const l = lead();
  if (!o.rtm) {
    if (l && l.tid === tid) hard.push('Already the highest bidder');
    if (lv.passed.includes(tid)) hard.push('Passed on this player');
    if (l && amt <= l.amt) hard.push('Bid must be more than ' + money(l.amt));
    if (!l && amt < lotBase(p)) hard.push('Opening bid is the base price ' + money(lotBase(p)));
  }
  if (amt > ti.purse) hard.push('❌ INSUFFICIENT PURSE — ' + money(ti.purse) + ' left');
  if (ti.count >= R.maxSquad) hard.push('❌ SQUAD FULL');
  if (p.overseas && ti.overseas >= R.maxOverseas) hard.push(hid ? '❌ NOT ELIGIBLE (hidden rule)' : '❌ OVERSEAS LIMIT REACHED');
  const rmax = R.roleMax[p.role];
  if (rmax != null && rmax !== '' && ti.roles[p.role] >= rmax) hard.push(hid ? '❌ NOT ELIGIBLE (hidden rule)' : `❌ ${ROLE_INFO[p.role].pl.toUpperCase()} LIMIT REACHED`);
  if (R.reserve.mode !== 'off' && amt <= ti.purse) {
    const slots = Math.max(0, R.minSquad - (ti.count + 1));
    const keep = slots * R.reserve.perSlot;
    if (amt > ti.purse - keep) {
      const msg = `MUST KEEP ${money(keep)} FOR ${plural(slots, 'MORE PLAYER', 'MORE PLAYERS')}`;
      if (R.reserve.mode === 'block') hard.push('❌ ' + msg); else soft.push('⚠️ ' + msg);
    }
  }
  if (!hid) {
    let needAfter = 0;
    for (const r of ROLES) needAfter += Math.max(0, (R.roleMin[r] || 0) - ti.roles[r] - (p.role === r ? 1 : 0));
    const roomAfter = R.maxSquad - (ti.count + 1);
    if (needAfter > roomAfter) soft.push(`⚠️ ROLE MINIMUMS CAN'T BE MET AFTER THIS BUY`);
  }
  if (amt <= ti.purse && ti.purse - amt < R.lowPurse) soft.push('⚠️ LOW PURSE AFTER THIS BID: ' + money(ti.purse - amt));
  return { hard, soft };
}
function shortReason(r) {
  if (/INSUFFICIENT/.test(r)) return 'NO PURSE';
  if (/SQUAD FULL/.test(r)) return 'FULL';
  if (/OVERSEAS/.test(r)) return 'OVERSEAS';
  if (/LIMIT/.test(r)) return 'ROLE LIMIT';
  if (/NOT ELIGIBLE/.test(r)) return 'BLOCKED';
  if (/MUST KEEP/.test(r)) return 'RESERVE';
  if (/Passed/.test(r)) return 'PASSED';
  if (/highest/.test(r)) return 'LEADING';
  return 'BLOCKED';
}

/* RTM availability for the current lot */
function rtmOption(p, l) {
  if (!p || !l || !p.prevTeam) return null;
  if (p.wild && !S.rules.wild.rtm) return null;
  const t = T(p.prevTeam);
  if (!t || l.tid === t.id) return null;
  if (S.rules.rtmCount <= 0 || D().ti[t.id].rtmLeft <= 0) return null;
  if (checkBid(t.id, l.amt, p, { rtm: true }).hard.length) return null;
  return { tid: t.id };
}

/* Sets */
function autoSetKind(p) {
  if (p.wild) return 'wild';
  if (p.mystery) return 'mystery';
  if (p.category === 'Marquee') return 'marquee';
  if (p.category === 'Uncapped') return 'uncapped';
  if (p.overseas) return 'overseas';

  if (p.role === 'WK') return 'wk';

}
function setLabel(s) {
  if (!s) return '';

  return `SET ${pad2(i + 1)} — ${s.name}`;
}
function setProgress(p) {
  const s = setOf(p);
  if (!s) return { label: 'UNASSIGNED', idx: 0, total: 0 };
  const members = S.players.filter(x => x.setId === s.id && x.status !== 'withdrawn');
  const done = members.filter(x => x.id !== p.id && (x.status === 'sold' || x.status === 'unsold')).length;
  return { label: setLabel(s), idx: Math.min(members.length, done + 1), total: members.length, set: s };
}
const orderKey = p => { const m = String(p.id).match(/(\d+)/); return m ? +m[1] : 9e9; };
function queueable(p) { return p && p.status === 'available' && S.live.pid !== p.id; }
function lotsDone() { return S.lots.filter(l => l.result === 'sold' || l.result === 'unsold').length; }
function lastLot() { return S.lots[S.lots.length - 1] || null; }
function atSetBoundary() {
  const last = lastLot(); const cur = lotPlayer();
  if (!last || !cur) return true;
  const lp = P(last.pid);
  return !lp || lp.setId !== cur.setId || S.live.phase === 'empty';
}
function wildRemaining() { return S.players.filter(p => p.wild && p.status === 'available' && !S.wildUsed.includes(p.id) && S.live.pid !== p.id); }
function wildLeft() { return Math.max(0, Math.min(S.rules.wild.max - S.wildUsed.length, wildRemaining().length)); }
function wildBlocked() {
  const r = S.rules.wild;
  if (!wildRemaining().length) return 'No wild card players are left. Mark players as Wild Card in Players.';
  if (S.wildUsed.length >= r.max) return 'All ' + r.max + ' wild cards have been used.';
  if (S.live.phase === 'bidding' && S.live.bids.length) return 'Finish the bidding on the current player first.';
  if (r.when === 'between' && !atSetBoundary()) return 'Wild cards can only enter between sets.';
  if (r.when === 'after' && lotsDone() < r.afterN) return `Wild cards unlock after ${r.afterN} players (${lotsDone()} done).`;
  return null;
}

/* ---------- Analysis (informational only) ---------- */
function fairCoef() {
  const sold = S.players.filter(p => p.status === 'sold' && p.soldPrice > 0);
  const sq = sum(sold.map(p => p.rating * p.rating));
  return sq ? sum(sold.map(p => p.soldPrice)) / sq : 0;
}
let FAIR = { rev: -1, k: 0 };
function fairPrice(p) {
  if (FAIR.rev !== S.rev || FAIR.s !== S) FAIR = { rev: S.rev, s: S, k: fairCoef() };
  return p.rating * p.rating * FAIR.k;
}
const hasTag = (p, re) => (p.tags || []).some(t => re.test(t));
function analyse(squad) {
  const n = squad.length;
  const R = S.rules;
  const top = squad.map(p => p.rating).sort((a, b) => b - a).slice(0, 11);
  while (top.length < 11) top.push(n ? 45 : 0);
  const strength = n ? Math.round(sum(top) / 11) : 0;
  const w = { BAT: [1, 0.15], WK: [0.9, 0], AR: [0.7, 0.7], BOWL: [0.1, 1] };
  const batPts = sum(squad.map(p => (w[p.role] || [0, 0])[0] * p.rating / 100));
  const bowlPts = sum(squad.map(p => (w[p.role] || [0, 0])[1] * p.rating / 100));
  const batting = Math.round(clamp(batPts / 6, 0, 1) * 100);
  const bowling = Math.round(clamp(bowlPts / 5, 0, 1) * 100);
  const ar = squad.filter(p => p.role === 'AR').length;
  const versTags = squad.filter(p => hasTag(p, /versatile/i)).length;
  const versatility = n ? Math.round(clamp((ar / Math.max(n, 6)) / 0.28 * 80 + versTags * 7, 0, 100)) : 0;
  const wks = squad.filter(p => p.role === 'WK').sort((a, b) => b.rating - a.rating);
  const fielders = squad.filter(p => hasTag(p, /field|safe hands/i)).length;
  const wk = Math.round(clamp((wks[0] ? wks[0].rating * 0.8 : 0) + (wks[1] ? 10 : 0) + fielders * 5, 0, 100));
  const ideal = { BAT: 0.32, BOWL: 0.32, AR: 0.22, WK: 0.14 };
  let dev = 0, unmet = 0;
  for (const r of ROLES) {
    const c = squad.filter(p => p.role === r).length;
    dev += Math.abs((n ? c / n : 0) - ideal[r]);
    if (c < (R.roleMin[r] || 0)) unmet += (R.roleMin[r] - c);
  }
  const balance = n ? Math.round(clamp(100 - dev * 110 - unmet * 8, 0, 100)) : 0;
  const fair = sum(squad.map(fairPrice));
  const paid = sum(squad.map(p => p.soldPrice || 0));
  const value = n && fair ? Math.round(clamp(50 + 100 * (fair - paid) / fair, 0, 100)) : 0;
  const overall = Math.round(0.25 * strength + 0.2 * balance + 0.15 * versatility + 0.15 * value + 0.1 * batting + 0.1 * bowling + 0.05 * wk);
  return { strength, balance, versatility, value, batting, bowling, wk, overall };
}

/* ---------- Auction statistics ---------- */
function computeStats() {
  const sold = S.players.filter(p => p.status === 'sold');
  const unsold = S.players.filter(p => p.status === 'unsold');
  const avail = S.players.filter(p => p.status === 'available' && !(p.wild && !S.wildUsed.includes(p.id)));
  const bids = S.log.filter(e => e.type === 'bid' && !e.voided);
  const most = sold.slice().sort((a, b) => b.soldPrice - a.soldPrice)[0] || null;
  const hb = bids.slice().sort((a, b) => b.amt - a.amt)[0] || null;
  const perLot = new Map();
  for (const b of bids) {
    if (!perLot.has(b.lot)) perLot.set(b.lot, { lot: b.lot, pid: b.pid, n: 0, teams: new Map() });
    const x = perLot.get(b.lot); x.n++; x.teams.set(b.tid, (x.teams.get(b.tid) || 0) + 1);
  }
  let war = null;
  for (const x of perLot.values()) if (!war || x.n > war.n) war = x;
  if (war) war.top = Array.from(war.teams.entries()).sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  let bargain = null;
  for (const p of sold) {
    const g = (fairPrice(p) - p.soldPrice) * Math.pow(p.rating / 100, 2);
    if (!bargain || g > bargain.gain) bargain = { p, gain: g };
  }
  const ti = S.teams.map(t => ({ t, spent: sum(sold.filter(p => p.soldTo === t.id).map(p => p.soldPrice)), n: sold.filter(p => p.soldTo === t.id).length }));
  const purseOf = t => S.rules.purse + sum((t.adjust || []).map(a => a.amt)) - sum(sold.filter(p => p.soldTo === t.id).map(p => p.soldPrice));
  const mostSpent = ti.slice().sort((a, b) => b.spent - a.spent)[0] || null;
  const mostPurse = S.teams.slice().sort((a, b) => purseOf(b) - purseOf(a))[0] || null;
  const mostPlayers = ti.slice().sort((a, b) => b.n - a.n)[0] || null;
  const total = sum(sold.map(p => p.soldPrice));
  return {
    sold: sold.length, unsold: unsold.length, left: avail.length,
    most, hb, war, bargain, mostSpent, mostPurse, mostPurseAmt: mostPurse ? purseOf(mostPurse) : 0, mostPlayers,
    avg: sold.length ? Math.round(total / sold.length) : 0, total,
    mysterySold: sold.filter(p => p.mystery).length, wildSold: sold.filter(p => p.wild).length,
    pool: unsold.filter(p => p.pool).length, bids: bids.length,
  };
}

/* ================= Auction actions ================= */
/* Sort players into the standard sets. With a list, only those players move and existing order is kept. */
function autoBuildSets(only) {
  const sets = S.sets.slice();
  for (const p of (only || S.players)) {
    if (p.round2 && !only) continue;
    const k = autoSetKind(p);
    let s = sets.find(x => x.kind === k);
    if (!s) { s = { id: uid('set'), name: AUTO_SETS.find(a => a[0] === k)[1], kind: k }; sets.push(s); }
    p.setId = s.id;
  }
  const isAuto = s => AUTO_SETS.some(a => a[0] === s.kind);
  const live = sets.filter(s => !isAuto(s) || S.players.some(p => p.setId === s.id));
  if (only) { S.sets = live; return; }
  const rank = s => { const i = AUTO_SETS.findIndex(a => a[0] === s.kind); return i >= 0 ? i : s.kind === 'unsold' ? 999 : 500; };
  S.sets = live.sort((a, b) => rank(a) - rank(b));
}
function rebuildQueue() {
  const q = [];
  for (const s of S.sets) {
    if (s.kind === 'wild') continue;
    S.players.filter(p => p.setId === s.id && queueable(p) && !p.wild).sort((a, b) => orderKey(a) - orderKey(b)).forEach(p => q.push(p.id));
  }
  S.players.filter(p => queueable(p) && !p.wild && !q.includes(p.id) && !S.sets.some(s => s.id === p.setId))
    .sort((a, b) => orderKey(a) - orderKey(b)).forEach(p => q.push(p.id));
  S.queue = q;
}

function timerSet(sec) {
  S.live.timer = S.rules.timer.on ? { endsAt: NOW() + sec * 1000, dur: sec * 1000, paused: false, left: null } : null;
}
function timerLeft(tm) {
  if (!tm) return null;
  if (tm.paused) return tm.left;
  return Math.max(0, tm.endsAt - Date.now());
}
function timerToggle() {
  const lv = S.live;
  if (!lv.pid || lv.phase === 'empty' || lv.phase === 'done') return;
  if (!S.rules.timer.on) return toast('The timer is switched off in Setup → Auction rules.', 'info');
  commit(() => {
    const tm = lv.timer;
    if (!tm) { timerSet(lv.bids.length ? S.rules.timer.perBid : S.rules.timer.first); return; }
    if (tm.paused) {
      const left = tm.left || 0;
      if (left <= 0) timerSet(S.rules.timer.perBid);
      else { tm.endsAt = Date.now() + left; tm.paused = false; tm.left = null; }
    } else { tm.left = Math.max(0, tm.endsAt - Date.now()); tm.paused = true; }
  });
}
function timerRestart() {
  if (!S.live.pid) return;
  commit(() => timerSet(S.live.bids.length ? S.rules.timer.perBid : S.rules.timer.first));
}

function loadLot(pid, how) {
  const p = S.players.find(x => x.id === pid);
  if (!p) return;
  const l = lastLot();
  const prevSet = l ? (S.players.find(x => x.id === l.pid) || {}).setId : null;
  S.queue = S.queue.filter(x => x !== pid);
  if (p.status === 'unsold') { p.status = 'available'; p.pool = false; }
  S.live = Object.assign(emptyLive(), { lotId: uid('lot'), pid, phase: 'ready', revealed: !(p.mystery && !p.revealed), how: how || 'queue' });
  if (p.wild && !S.wildUsed.includes(pid)) { S.wildUsed.push(pid); p.wildAt = NOW(); }

}

  S.queue = S.queue.filter(id => queueable(S.players.find(p => p.id === id)));

  if (lv.phase === 'ready' && isHiddenNow(p) && S.rules.mystery.reveal === 'before') { toast('Reveal the mystery player first (press M).', 'warn'); return false; }

  commit(() => { S.live.clues = n + 1; log({ type: 'clue', pid: p.id, note: `#${n + 1} ${c}` }); fire('clue', { pid: p.id, n: n + 1, text: c }); });

}

/* ---------- Wild cards ---------- */
function introduceWild(pid) {

  closeModal();
  commit(() => {
    const lv = S.live, cur = lotPlayer();
    if (cur && cur.status === 'available' && lv.phase !== 'done' && !lv.bids.length && cur.id !== pid) S.queue.unshift(cur.id);
    loadLot(pid, 'wild');

    timerSet(S.rules.timer.first + 6);
