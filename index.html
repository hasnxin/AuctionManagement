/* ---------- Queue ---------- */
function qMove(pid, d) {
  commit(() => {
    const q = S.queue, i = q.indexOf(pid), j = i + d;
    if (i < 0 || j < 0 || j >= q.length) return;
    [q[i], q[j]] = [q[j], q[i]];
  });
}
function qRemove(pid) { commit(() => { S.queue = S.queue.filter(x => x !== pid); }); toast('Removed from the queue. The player is still available.', 'info'); }
function qToEnd(pid) { commit(() => { S.queue = S.queue.filter(x => x !== pid).concat(pid); }); }
function qDrop(pid, target, before) {
  if (pid === target) return;
  commit(() => {
    const q = S.queue.filter(x => x !== pid);
    let j = q.indexOf(target);
    if (j < 0) j = q.length; else if (!before) j++;
    q.splice(j, 0, pid);
    S.queue = q;
  });
}
function qAdd(pid, where) {
  const p = P(pid);

  if (p.status === 'sold') return toast(`${p.name} is already sold.`, 'warn');
  if (p.status === 'withdrawn') return toast(`${p.name} is withdrawn. Restore the player first.`, 'warn');
  if (S.live.pid === p.id && S.live.phase !== 'done') return toast(`${p.name} is on the block right now.`, 'info');
  commit(() => {
    if (p.status === 'unsold') { p.status = 'available'; p.pool = false; log({ type: 'unsold_round', pid, note: `${p.name} back in the auction` }); }
    S.queue = S.queue.filter(x => x !== pid);
    if (where === 'next') S.queue.unshift(pid); else S.queue.push(pid);
    if (S.live.phase === 'empty') advance();
  });
  toast(`${publicName(p)} ${where === 'next' ? 'is up next' : 'added to the end of the queue'}.`, 'good');
}
function auctionNow(pid) {
  const p = P(pid);
  if (!p) return;
  if (p.status === 'sold') return toast(`${p.name} is already sold. Use Corrections to re-auction.`, 'warn');
  if (p.status === 'withdrawn') return toast(`${p.name} is withdrawn. Restore the player first.`, 'warn');
  const lv = S.live;
  if (lv.pid === pid && lv.phase !== 'done') { nav('control'); return; }
  if (lv.phase === 'bidding' && lv.bids.length) return toast('Finish bidding on the current player first (S or U).', 'warn');
  if (p.wild && !S.wildUsed.includes(p.id)) { nav('control'); return introduceWild(pid); }
  commit(() => {
    const cur = lotPlayer();
    if (cur && cur.status === 'available' && lv.phase !== 'done') S.queue.unshift(cur.id);
    if (p.status === 'unsold') log({ type: 'unsold_round', pid, note: `${p.name} back in the auction` });
    loadLot(pid, 'manual');
  });

}
function skipCurrent() {
  const lv = S.live, p = lotPlayer();

  if (lv.bids.length) return toast('There are bids on this player. Press S (sold) or U (unsold).', 'warn');
  commit(() => {
    S.queue = S.queue.filter(x => x !== p.id).concat(p.id);
    log({ type: 'skip', pid: p.id, note: 'moved to the end of the queue' });
    S.lots.push({ lotId: lv.lotId, pid: p.id, result: 'skip', t: NOW() });
    advance();
  });

}
function nextPlayer() {
  const lv = S.live;
  if (lv.phase === 'bidding' && lv.bids.length) return toast('Bids are open. Press S (sold) or U (unsold) first.', 'warn');
  if ((lv.phase === 'ready' || lv.phase === 'bidding') && lv.pid) return skipCurrent();
  const q = S.queue.filter(id => queueable(P(id)));
  if (!q.length) {
    if (lv.phase === 'done') commit(() => { S.live = emptyLive(); });
    return toast('The queue is empty. Add players, or start the unsold round from the Unsold pool tab.', 'warn');
  }
  commit(() => advance());
}
function prevPlayer() {
  const lv = S.live;
  const last = [...S.lots].reverse().find(l => l.pid !== lv.pid);
  if (!last) return toast('There is no previous player yet.', 'info');
  const p = P(last.pid);
  if (!p) return;
  if (p.status === 'sold') return toast(`${p.name} was sold to ${T(p.soldTo).name}. To re-auction, use Corrections.`, 'warn');
  if (p.status === 'withdrawn') return toast(`${p.name} is withdrawn.`, 'warn');
  if (lv.phase === 'bidding' && lv.bids.length) return toast('Finish bidding on the current player first.', 'warn');
  commit(() => {
    const cur = lotPlayer();
    if (cur && cur.status === 'available' && lv.phase !== 'done') S.queue.unshift(cur.id);
    if (p.status === 'unsold') log({ type: 'unsold_round', pid: p.id, note: `${p.name} brought back` });
    loadLot(p.id, 'back');
  });
}

/* ---------- Unsold round ---------- */
function startUnsoldRound(ids) {
  ids = ids.filter(id => (P(id) || {}).status === 'unsold');

/* ---------- Admin corrections (always logged, always checkpointed) ---------- */
const why = r => (r ? ' · ' + r : '');
function corrTeam(pid, tid, reason) {
  const p = P(pid); if (!p || p.status !== 'sold' || p.soldTo === tid) return;
  const from = T(p.soldTo).short;
  commit(() => {
    p.soldTo = tid; if (p.acq === 'rtm') p.acq = 'auction';
    log({ type: 'correction', pid, tid, amt: p.soldPrice, note: `${p.name}: team ${from} → ${T(tid).short}${why(reason)}` });
  }, { ck: `Correction: ${p.name} team` });
  toast('Team corrected and purses recalculated.', 'good');
}
function corrPrice(pid, amt, reason) {
  const p = P(pid); if (!p || p.status !== 'sold' || amt == null || amt < 0) return;
  const old = p.soldPrice;
  commit(() => {
    p.soldPrice = amt;
    log({ type: 'correction', pid, tid: p.soldTo, amt, note: `${p.name}: price ${money(old)} → ${money(amt)}${why(reason)}` });
  }, { ck: `Correction: ${p.name} price` });
  toast('Price corrected and purse recalculated.', 'good');
}
function refund(p) { Object.assign(p, { soldTo: '', soldPrice: null, acq: '', soldAt: null }); }
function corrReauction(pid, reason) {
  const p = P(pid); if (!p) return;
  if (S.live.pid === pid && S.live.phase !== 'done') return toast(`${p.name} is already on the block.`, 'info');
  const was = p.status === 'sold' ? `${T(p.soldTo).short} ${money(p.soldPrice)}` : p.status;
  commit(() => {
    refund(p); p.status = 'available'; p.pool = false;
    S.queue = [pid].concat(S.queue.filter(x => x !== pid));
    log({ type: 'correction', pid, note: `${p.name}: re-auction (was ${was})${why(reason)}` });
    if (S.live.phase === 'empty' || S.live.phase === 'done') advance();
  }, { ck: `Correction: re-auction ${p.name}` });
  toast(`${p.name} is up next for re-auction.`, 'good');
}
function corrToPool(pid, reason) {
  const p = P(pid); if (!p) return;
  if (S.live.pid === pid && S.live.phase === 'bidding' && S.live.bids.length) return toast('Finish the current bidding first.', 'warn');
  const was = p.status === 'sold' ? `${T(p.soldTo).short} ${money(p.soldPrice)}` : p.status;
  commit(() => {
    refund(p); p.status = 'unsold'; p.pool = true;
    S.queue = S.queue.filter(x => x !== pid);
    log({ type: 'correction', pid, note: `${p.name}: moved to unsold pool (was ${was})${why(reason)}` });
    if (S.live.pid === pid) advance();
  }, { ck: `Correction: ${p.name} to unsold pool` });
  toast(`${p.name} moved to the unsold pool.`, 'good');
}
function corrRemove(pid, reason) {
  const p = P(pid); if (!p || p.status !== 'sold') return;
  const was = `${T(p.soldTo).short} ${money(p.soldPrice)}`;
  commit(() => {
    refund(p); p.status = 'available';
    log({ type: 'correction', pid, note: `${p.name}: removed from squad (was ${was}); available again${why(reason)}` });
  }, { ck: `Correction: remove ${p.name} from squad` });
  toast(`${p.name} removed from the squad and refunded.`, 'good');
}
function corrAssign(pid, tid, amt, reason) {
  const p = P(pid); if (!p || amt == null) return;
  if (p.status === 'sold') return toast(`${p.name} is already in a squad. Use "Change team".`, 'warn');
  if (S.live.pid === pid && S.live.phase !== 'done') return toast(`${p.name} is on the block. Sell them from the control room.`, 'warn');
  commit(() => {
    Object.assign(p, { status: 'sold', soldTo: tid, soldPrice: amt, acq: 'direct', soldAt: NOW(), pool: false });
    if (p.mystery) p.revealed = true;
    S.queue = S.queue.filter(x => x !== pid);

  }, { ck: `Correction: assign ${p.name}` });

}
function corrPurse(tid, amt, reason) {
  const t = T(tid); if (!t || !amt) return;
  commit(() => {
    t.adjust.push({ amt, reason: reason || '', t: NOW() });
    log({ type: 'correction', tid, amt, note: `${t.short} purse ${amt > 0 ? '+' : ''}${money(amt)}${why(reason)}` });
  }, { ck: `Correction: ${t.short} purse` });
  toast('Purse adjusted.', 'good');
}
function withdrawPlayer(pid) {
  const p = P(pid); if (!p) return;
  if (p.status === 'sold') return toast(`${p.name} is sold. Remove them from the squad first (Corrections).`, 'warn');
  if (S.live.pid === pid && S.live.phase === 'bidding' && S.live.bids.length) return toast('There are bids on this player.', 'warn');
  commit(() => {
    p.status = 'withdrawn'; p.pool = false;
    S.queue = S.queue.filter(x => x !== pid);
    log({ type: 'withdraw', pid, note: `${p.name} withdrawn` });
    if (S.live.pid === pid) advance();
  }, { ck: `Withdraw ${p.name}` });
}

  const p = P(pid); if (!p || p.status !== 'withdrawn') return;
  commit(() => { p.status = 'available'; log({ type: 'withdraw', pid, note: `${p.name} restored` }); });

function timerState() {
  const lv = S.live, tm = lv.timer;
  if (!lv.pid || lv.phase === 'empty' || lv.phase === 'done') return { cls: 'off', text: '—', sub: '', frac: 0 };
  if (!S.rules.timer.on) return { cls: 'off', text: 'OFF', sub: 'Timer switched off', frac: 0 };
  if (!tm) return { cls: 'paused', text: fmtSec(S.rules.timer.first * 1000), sub: lv.phase === 'ready' ? 'Starts with bidding' : 'Click to start', frac: 1 };
  const left = timerLeft(tm);
  const frac = tm.dur ? clamp(left / tm.dur, 0, 1) : 0;
  if (tm.paused) return { cls: 'paused', text: fmtSec(left), sub: 'PAUSED · click to resume', frac };
  if (left <= 0) return { cls: 'up', text: '0:00', sub: lv.bids.length ? 'TIME UP · press S' : 'TIME UP · no bids', frac: 0 };
  return { cls: left <= 5000 ? 'low' : '', text: fmtSec(left), sub: 'Resets on every bid', frac };
}
let timeUpSeen = null;
function paintTimer() {
  if (!S) return;
  const st = timerState();
  const el = $('#timer');
  if (el) {
    const cls = 'timer ' + st.cls;
    if (el.className !== cls) el.className = cls;
    const html = `<span class="lbl">TIMER</span><span class="t">${st.text}</span><span class="sub">${esc(st.sub)}</span><span class="bar" style="transform:scaleX(${st.frac.toFixed(3)})"></span>`;
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
  }
  const pj = $('#pjTimer');
  if (pj) { pj.className = 'pj-timer ' + (st.cls === 'paused' ? '' : st.cls); if (pj.textContent !== st.text) pj.textContent = st.text; }
  const sold = $('.act.sold');
  if (sold) sold.classList.toggle('hot', st.cls === 'up' && !!lead());
  const key = S.live.lotId + ':' + (S.live.timer && S.live.timer.endsAt);
  if (st.cls === 'up' && S.live.phase === 'bidding' && timeUpSeen !== key) { timeUpSeen = key; SFX.timeup(); }
}

/* RTM: offer → (optional final raise → match) → sale */
function openRTM(tid, step) { UI.rtm = { tid, step, raise: null }; drawRTM(); }
function drawRTM() {
  const r = UI.rtm, p = lotPlayer(), l = lead();
  if (!r || !p || !l) return closeModal();
  const lt = T(l.tid);
  let body = '', foot = '', keys = {}, onEnter = null;
  if (r.step === 'pick') {
    body = `<p>Which team holds the Right to Match for <b>${esc(publicName(p))}</b>?</p><div class="pick-grid">${S.teams.filter(t => t.id !== l.tid).map(t => `<button class="chip" data-act="rtm-pick" data-team="${t.id}" style="--tc:${esc(t.color)}"><span class="c-short">${esc(t.short)}</span><span class="c-purse">RTM left: ${D().ti[t.id].rtmLeft}</span></button>`).join('')}</div>`;
    foot = `<button class="btn ghost" data-act="modal-close">CANCEL <kbd>Esc</kbd></button>`;
  } else if (r.step === 'offer') {
    const ot = T(r.tid), oti = D().ti[r.tid];
    const ch = checkBid(r.tid, l.amt, p, { rtm: true });
    const block = oti.rtmLeft <= 0 ? 'No RTM cards left.' : ch.hard[0];
    body = `<div class="sale-grid">
        <div><span>ORIGINAL TEAM</span><b>${teamBadge(r.tid)}</b></div>
        <div><span>CURRENT BID</span><b class="big">${money(l.amt, { fixed: true })}</b></div>
        <div><span>HIGHEST BIDDER</span><b>${teamBadge(l.tid)}</b></div>
        <div><span>RTM CARDS</span><b>${oti.rtmLeft} of ${S.rules.rtmCount} left</b></div>
      </div>
      ${block ? `<div class="notice bad">${esc(ot.name)} cannot use RTM: ${esc(block)}</div>` : `<p>Ask <b>${esc(ot.name)}</b>: match ${money(l.amt)} to keep ${esc(publicName(p))}?</p>`}`;
    foot = `<button class="btn ghost" data-act="rtm-decline">DECLINE <kbd>N</kbd></button><button class="btn blue lg" data-act="rtm-use" ${block ? 'disabled' : ''}>USE RTM <kbd>Y</kbd></button>`;
    keys = { n: rtmDecline, y: () => { if (!block) rtmUse(); } };
  } else if (r.step === 'raise') {
    body = `<p><b>${esc(T(r.tid).name)}</b> wants to use RTM. <b>${esc(lt.name)}</b> may make one final raise.</p>
      <label class="f"><span>Final raise (${esc(S.rules.currency.unit || 'amount')})</span><input id="rtmRaise" type="number" step="0.05" min="${crVal(l.amt)}" value="${crVal(l.amt + autoStep(l.amt))}" autofocus></label>`;
    foot = `<button class="btn ghost" data-act="rtm-noraise">NO RAISE · RTM AT ${money(l.amt)}</button><button class="btn gold" data-act="rtm-raise">RAISE <kbd>Enter</kbd></button>`;
    onEnter = rtmRaise;
  } else if (r.step === 'match') {
    body = `<div class="sale-grid"><div><span>FINAL RAISE</span><b class="big">${money(r.raise, { fixed: true })}</b></div><div><span>BY</span><b>${teamBadge(l.tid)}</b></div></div><p>Does <b>${esc(T(r.tid).name)}</b> match ${money(r.raise)}?</p>`;
    foot = `<button class="btn ghost" data-act="rtm-nomatch">NO · SOLD TO ${esc(lt.short)} <kbd>N</kbd></button><button class="btn blue lg" data-act="rtm-match">MATCH <kbd>Y</kbd></button>`;
    keys = { y: () => rtmMatch(true), n: () => rtmMatch(false) };
  }
  openModal({ id: 'rtm', tone: 'blue', title: '🔁 RIGHT TO MATCH', body, foot, keys, onEnter });
}
function rtmUse() {
  const r = UI.rtm, l = lead();
  if (!r || !l) return;
  if (S.rules.rtmRaise) { r.step = 'raise'; return drawRTM(); }
  closeModal();
  rtmSell(r.tid, l.amt);
}
function rtmDecline() {
  const r = UI.rtm;
  if (r && r.tid) rtmDeclined(r.tid);
  closeModal();
  openConfirmSale();
}
function rtmRaise() {
  const r = UI.rtm, l = lead(), p = lotPlayer();
  const amt = cr2l(($('#rtmRaise') || {}).value);
  if (!(amt > l.amt)) return toast('The raise must be more than ' + money(l.amt) + '.', 'warn');
  const saved = S.live.bids.pop();
  const ch = checkBid(l.tid, amt, p, { rtm: true });
  S.live.bids.push(saved);
  if (ch.hard.length) return toast(T(l.tid).name + ': ' + ch.hard[0], 'bad');
  rtmRaiseBid(amt);
  r.raise = amt; r.step = 'match';
  drawRTM();
}
function rtmMatch(yes) {
  const r = UI.rtm, l = lead(), p = lotPlayer();
  if (!r || !l) return;
  if (yes) {
    const ch = checkBid(r.tid, r.raise, p, { rtm: true });
    if (ch.hard.length) return toast(T(r.tid).name + ': ' + ch.hard[0], 'bad');
    closeModal(); rtmSell(r.tid, r.raise);
  } else { rtmDeclined(r.tid); closeModal(); sell(l.tid, r.raise, 'auction', 'after RTM raise'); }
}

function alertPresets() {
  const st = D().st, d = D();
  const lastSale = [...S.lots].reverse().find(x => x.result === 'sold');
  const ls = lastSale && P(lastSale.pid), lsT = lastSale && T(lastSale.tid);
  const counts = new Map();
  S.live.bids.forEach(b => counts.set(b.tid, (counts.get(b.tid) || 0) + 1));
  let war = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  if (war.length < 2) war = st.war && st.war.top.length === 2 ? st.war.top : null;
  const poorest = S.teams.slice().sort((a, b) => d.ti[a.id].purse - d.ti[b.id].purse)[0];
  const l = lead();
  const up = s => String(s).toUpperCase();
  const bg = st.bargain && st.bargain.p;
  const out = [
    { title: '🚨 BREAKING NEWS', tone: 'red', text: lsT ? `${up(lsT.name)} JUST SPENT ${up(money(lastSale.amt))}!` : 'THE AUCTION IS LIVE!', sugg: !!(lastSale && lastSale.amt >= cr2l(10) && Date.now() - lastSale.t < 120000) },
    { title: '🔥 BIDDING WAR!', tone: 'wild', text: war ? `${up(T(war[0]).name)} AND ${up(T(war[1]).name)} ARE NOT GIVING UP!` : 'NOBODY IS BACKING DOWN!', sugg: S.live.phase === 'bidding' && S.live.bids.length >= 10 },
    { title: '💎 MASSIVE BARGAIN!', tone: 'blue', text: bg ? `${up(money(bg.soldPrice))} FOR A PLAYER RATED ${bg.rating}!` : 'WHAT A STEAL!', sugg: !!(ls && ls.rating >= 85 && lastSale.amt <= ls.base * 1.5 && Date.now() - lastSale.t < 120000) },
    { title: '💀 PURSE IN DANGER', tone: 'red', text: poorest ? `${up(poorest.name)} HAS ONLY ${up(money(d.ti[poorest.id].purse))} LEFT!` : 'SOMEONE IS RUNNING LOW!', sugg: !!(poorest && d.ti[poorest.id].purse < S.rules.lowPurse) },
    { title: '😭 WHAT JUST HAPPENED?', tone: 'purple', text: l ? `${up(T(l.tid).name)} BID ${up(money(l.amt))}!` : lsT ? `${up(lsT.name)} PAID ${up(money(lastSale.amt))}!` : 'DID THAT JUST HAPPEN?', sugg: false },
  ];
  if (st.most) out.push({ title: '🧨 RECORD BUY', tone: 'gold', text: `${up(st.most.name)} IS THE MOST EXPENSIVE PLAYER SO FAR AT ${up(money(st.most.soldPrice))}!`, sugg: !!(lastSale && st.most.id === lastSale.pid && Date.now() - lastSale.t < 120000) });
  return out;
}
function openAlerts() {
  const ps = alertPresets();
  UI.presets = ps;
  openModal({
    id: 'alerts', tone: 'red', title: '📢 BREAKING NEWS', wide: true,
    body: `<p>Pick an alert to load it, change the words if you like, then put it on the big screen. It stays up for 7 seconds; <kbd>Esc</kbd> hides it sooner.</p>
      <div class="preset-grid">${ps.map((x, i) => `<button class="preset ${x.sugg ? 'sugg' : ''}" data-act="alert-pick" data-i="${i}"><b>${esc(x.title)}${x.sugg ? ' <small class="warn">· SUGGESTED</small>' : ''}</b><span>${esc(x.text)}</span></button>`).join('')}<button class="preset" data-act="alert-pick" data-i="custom"><b>✍️ CUSTOM</b><span>Write your own announcement</span></button></div>
      <div class="form-grid"><label class="f span2"><span>Headline</span><input id="alTitle" type="text" maxlength="40"></label>
      <label class="f"><span>Colour</span><select id="alTone"><option value="red">Red</option><option value="gold">Gold</option><option value="wild">Orange</option><option value="purple">Purple</option><option value="blue">Blue</option><option value="green">Green</option></select></label>
      <label class="f span-all"><span>Message</span><input id="alText" type="text" maxlength="100"></label></div>`,
    foot: `<button class="btn ghost" data-act="modal-close">CANCEL <kbd>Esc</kbd></button><button class="btn red lg" data-act="alert-fire">SHOW ON SCREEN <kbd>Enter</kbd></button>`,
    onEnter: fireDraft,
  });
  const first = ps.find(x => x.sugg) || ps[0];
  fillAlert(first);
}
function fillAlert(x) {
  const a = $('#alTitle'), b = $('#alText'), c = $('#alTone');
  if (a) a.value = x.title; if (b) b.value = x.text; if (c) c.value = x.tone;
}
function fireDraft() {
  const title = (($('#alTitle') || {}).value || '').trim() || '📢 ANNOUNCEMENT';
  const text = (($('#alText') || {}).value || '').trim();
  if (!text) return toast('Write a message first.', 'warn');
  fireAlert(title, text, ($('#alTone') || {}).value || 'red');
}

/* For typing into forms: save without re-rendering the form being typed in. */
function quietSave(after) {
  clearTimeout(quietTimer);
  quietTimer = setTimeout(() => { if (!canWrite()) return; S.rev++; S.updated = NOW(); persist(); renderTop(); if (after) after(); }, 350);
}

function nextPlayerId() {

function nextCode(prefix, field) {

function savePlayerEditor() {
  const v = id => ($('#' + id) || {}).value;
  const name = String(v('peName') || '').trim();
  const id = String(v('peId') || '').trim();
  if (!name) return toast('Enter the player name.', 'warn');
  if (!id) return toast('Enter a player ID.', 'warn');
  const orig = UI.pe.orig;
  if (S.players.some(p => p.id === id && p.id !== orig)) return toast('Another player already has ID ' + id + '.', 'warn');
  const kind = v('peKind');
  const extra = String(v('peTagX') || '').split(',').map(s => s.trim()).filter(Boolean);
  const data = {
    id, name, role: v('peRole'), bat: v('peBat'), bowl: String(v('peBowl') || '').trim(), rating: clamp(parseInt(v('peRating'), 10) || 0, 0, 100),
    base: Math.max(0, cr2l(v('peBase') || 0)), category: v('peCat'), overseas: v('peOs') === '1', setId: v('peSet'), prevTeam: v('pePrev'),
    tags: UI.pe.tags.concat(extra.filter(t => !UI.pe.tags.includes(t))), photo: UI.pe.photo || '',
    mystery: kind === 'mystery', wild: kind === 'wild',
  };
  data.bowlKind = bowlKindOf(data.bowl);
  if (data.mystery) { data.mcode = String(v('peMcode') || '').trim() || nextCode('M-', 'mcode'); data.clues = String(v('peClues') || '').split('\n').map(s => s.trim()).filter(Boolean); }
  if (data.wild) data.wcode = String(v('peWcode') || '').trim() || nextCode('WC-', 'wcode');
  commit(() => {
    if (orig) {
      const p = S.players.find(x => x.id === orig);
      if (orig !== id) {
        S.queue = S.queue.map(x => (x === orig ? id : x));
        if (S.live.pid === orig) S.live.pid = id;
        S.log.forEach(e => { if (e.pid === orig) e.pid = id; });
        S.lots.forEach(l => { if (l.pid === orig) l.pid = id; });
        S.wildUsed = S.wildUsed.map(x => (x === orig ? id : x));
      }
      Object.assign(p, data);
      if (data.wild) S.queue = S.queue.filter(x => x !== id || S.wildUsed.includes(id));
    } else {
      S.players.push(newPlayer(data));
      if (!data.wild) S.queue.push(id);
    }
  });
  closeModal();
  toast(orig ? 'Player saved.' : name + ' added' + (data.wild ? ' as a wild card.' : ' and queued.'), 'good');
}

function judgeTotals(jid, tid) {
  const sc = ((S.judging.scores[jid] || {})[tid]) || {};
  const vals = CRIT.map(([k]) => sc[k]);
  const filled = vals.filter(v => v !== undefined && v !== '' && v !== null).length;
  return { total: Math.round(sum(vals) * 10) / 10, filled, complete: filled === CRIT.length };
}
function standings() {
  const js = S.judging.judges;
  return S.teams.map(t => {
    const per = js.map(j => judgeTotals(j.id, t.id));
    const scored = per.filter(x => x.filled);
    const avg = scored.length ? Math.round(sum(scored.map(x => x.total)) / scored.length * 10) / 10 : null;
    return { t, per, avg, complete: per.every(x => x.complete) };
  }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
}
const AWARDS = [['champions', '🏆 Auction Champions'], ['value', '💎 Best Value Buy'], ['war', '🔥 Biggest Bidding War'], ['mystery', '🕵️ Best Mystery Player'], ['wild', '🃏 Best Wild Card'], ['purchase', '💰 Biggest Purchase'], ['funny', '😂 Funniest Purchase'], ['destroyer', '💀 Purse Destroyer'], ['bargain', '🤑 Biggest Bargain']];
function awardSuggestion(k) {
  const st = D().st, sold = S.players.filter(p => p.status === 'sold');
  const best = list => list.sort((a, b) => b.rating - a.rating)[0];
  switch (k) {
    case 'champions': { const s = standings()[0]; return s && s.avg != null ? { tid: s.t.id, note: `Top of the judges' table with ${s.avg} / 100` } : null; }
    case 'value': return st.bargain ? { tid: st.bargain.p.soldTo, pid: st.bargain.p.id, note: `${money(st.bargain.p.soldPrice)} for a player rated ${st.bargain.p.rating}` } : null;
    case 'war': { const w = st.war, p = w && P(w.pid); return p ? { tid: p.soldTo || (w.top[0] || ''), pid: p.id, note: plural(w.n, 'bid') } : null; }
    case 'mystery': { const p = best(sold.filter(x => x.mystery)); return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, bought for ${money(p.soldPrice)}` } : null; }
    case 'wild': { const p = best(sold.filter(x => x.wild)); return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, bought for ${money(p.soldPrice)}` } : null; }
    case 'purchase': return st.most ? { tid: st.most.soldTo, pid: st.most.id, note: money(st.most.soldPrice) } : null;
    case 'destroyer': return st.mostSpent && st.mostSpent.spent ? { tid: st.mostSpent.t.id, note: `Spent ${money(st.mostSpent.spent)}` } : null;
    case 'bargain': { const p = sold.filter(x => x.soldPrice <= x.base * 1.1).sort((a, b) => b.rating - a.rating || a.soldPrice - b.soldPrice)[0]; return p ? { tid: p.soldTo, pid: p.id, note: `Rated ${p.rating}, went at base price ${money(p.soldPrice)}` } : null; }
  }
  return null;
}

function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) { const ks = path.split('.'); const last = ks.pop(); const tgt = ks.reduce((a, k) => a[k], o); tgt[last] = v; }
function fld(label, path, t, o = {}) {
  const v = getPath(S, path);
  const hint = o.hint ? ` <small>${o.hint}</small>` : '';
  if (t === 'bool') return `<label class="check"><input type="checkbox" data-bind="${path}" data-t="bool" ${v ? 'checked' : ''}> ${label}</label>`;
  if (t === 'select') return `<label class="f"><span>${label}${hint}</span><select data-bind="${path}" data-t="${o.vt || 'str'}">${o.opts.map(([k, l]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  const val = t === 'money' ? crVal(v) : (v ?? '');
  const num = t !== 'str';
  return `<label class="f"><span>${label}${hint}</span><input type="${num ? 'number' : 'text'}"${num ? ` step="${t === 'money' ? '0.05' : '1'}"${o.min != null ? ` min="${o.min}"` : ''}${o.max != null ? ` max="${o.max}"` : ''}` : ''} data-bind="${path}" data-t="${t}" value="${esc(val)}"></label>`;
}
function bindChange(el) {
  const path = el.dataset.bind, t = el.dataset.t;
  let v;
  if (t === 'bool') v = el.checked;
  else if (t === 'money') { v = el.value === '' ? null : cr2l(el.value); if (v == null || v < 0) { toast('Enter an amount of 0 or more.', 'warn'); return PAGES.setup.build(); } }
  else if (t === 'int') { v = parseInt(el.value, 10); if (!isFinite(v) || v < 0) { toast('Enter a whole number.', 'warn'); return PAGES.setup.build(); } }
  else v = el.value;
  if (path === 'rules.minSquad' && v > S.rules.maxSquad) return toast('Minimum squad cannot be more than the maximum squad.', 'warn');
  if (path === 'rules.maxSquad' && v < S.rules.minSquad) return toast('Maximum squad cannot be less than the minimum squad.', 'warn');
  commit(() => { setPath(S, path, v); });
  if (path.startsWith('rules.currency') || path === 'rules.timer.on' || path === 'rules.wild.when' || path === 'rules.wild.specialBase' || path === 'rules.mystery.hide') PAGES.setup.build();
}

/* ---------- Setup actions ---------- */
function setTeamCount(n) {
  n = clamp(n, 2, 15);
  if (n === S.teams.length) return;
  if (n < S.teams.length) {
    const drop = S.teams.slice(n);
    const busy = drop.find(t => S.players.some(p => p.soldTo === t.id) || S.live.bids.some(b => b.tid === t.id));
    if (busy) return toast(`${busy.name} has players or bids. Clear them before removing the team.`, 'warn');
    commit(() => {
      const ids = drop.map(t => t.id);
      S.teams = S.teams.slice(0, n);
      S.players.forEach(p => { if (ids.includes(p.prevTeam)) p.prevTeam = ''; });
      S.live.passed = S.live.passed.filter(x => !ids.includes(x));
    });
  } else commit(() => { while (S.teams.length < n) S.teams.push(newTeam(S.teams.length)); });
  PAGES.setup.build();
}
function resetResults() {
  confirmBox({
    title: 'CLEAR RESULTS', tone: 'red', typed: 'CLEAR', ok: 'CLEAR RESULTS', okClass: 'red',
    html: '<p>All sales, bids, the feed, judging scores and awards are cleared. Teams, players, sets and rules stay. Every player becomes available again.</p><p class="muted">Export a backup first if you need this auction again.</p>',
    onOk: () => {
      commit(() => {
        S.players.forEach(p => { Object.assign(p, { status: p.status === 'withdrawn' ? 'withdrawn' : 'available', soldTo: '', soldPrice: null, acq: '', pool: false, round2: false, revealed: false, highBid: null }); if (p.origSet) { p.setId = p.origSet; delete p.origSet; } });
        S.sets = S.sets.filter(s => s.kind !== 'unsold');
        S.teams.forEach(t => { t.adjust = []; });
        S.live = emptyLive(); S.lots = []; S.wildUsed = []; S.log = []; S.fx = null; S.sample = false;
        S.judging.scores = {}; S.awards = {};
        rebuildQueue(); advance();
      });
      CK = []; saveCK();
      closeModal(); nav('control');
      toast('Results cleared. The first player is on the block.', 'good');
    },
  });
}
function freshStart() {
  confirmBox({
    title: 'START FRESH', tone: 'red', typed: 'FRESH', ok: 'START FRESH', okClass: 'red',

function renderProj() {
  const root = $('#proj');
  if (!root || root.hidden) return;
  if (!root._built) {
    root.innerHTML = `<div class="pj-top" id="pjTop"></div><div class="pj-main" id="pjMain"></div>
      <div class="pj-foot"><div class="pj-feed" id="pjFeed"></div><div class="pj-purses" id="pjPurses"></div></div>
      <div class="pj-fx" id="pjFx"></div>
      <div class="pj-hint">${MODE === 'projector' ? 'Press F for full screen' : 'V returns to the control room · F for full screen · shortcuts still work'}</div>`;
    root._built = true;
  }

const FXD = { sold: 3200, unsold: 2000, wild: 6500, reveal: 3600, alert: 7000, set: 2600, award: 9000, clue: 3500 };
function fxDur(fx) {
  if (!fx) return 0;
  let d = FXD[fx.kind] || 2500;
  if (fx.kind === 'sold' && fx.data && fx.data.reveal) d += 1800;
  return d;
}

      <div class="fx-late" style="--d:1.5s">${ph}<div class="fx-meta">${p ? `${roleText(p)} · RATING ${esc(p.rating)} · BASE ${money(lotBase(p))}` : ''}</div>
      ${p && p.tags && p.tags.length ? `<div class="pj-tags" style="justify-content:center">${p.tags.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : ''}</div></div>`;
    case 'alert': return `<div class="fx fx-alert tone-${esc(d.tone || 'red')}"><div class="fx-a-title">${esc(d.title)}</div><div class="fx-a-text">“${esc(d.text)}”</div></div>`;
    case 'set': { const s = S.sets.find(x => x.id === d.setId); const n = s ? S.players.filter(x => x.setId === s.id && x.status !== 'withdrawn').length : 0; return `<div class="fx fx-set"><small>NOW STARTING</small><b>${esc(setLabel(s))}</b><span>${plural(n, 'PLAYER')}</span></div>`; }
    case 'award': return `<div class="fx fx-award"><div class="trophy">🏆</div><small>${esc(d.title)}</small><b>${t ? esc(t.name) : ''}</b>${p ? `<span>${esc(p.name)}</span>` : ''}${d.note ? `<p>${esc(d.note)}</p>` : ''}</div>`;
    case 'clue': return `<div class="fx fx-reveal"><div class="fx-k">🔍 CLUE #${esc(d.n)}</div><div class="fx-name" style="text-transform:none">“${esc(d.text)}”</div></div>`;
  }
  return '';
}
function runFx(el, big) {
  if (!el || !S) return;
  const fx = S.fx;
  if (!fx || fx.dismissed) { if (el.classList.contains('on')) hideFx(el); if (fx) el._seq = fx.seq; return; }
  if (el._seq === fx.seq) return;
  el._seq = fx.seq;
  const now = Date.now();
  let start = fx.at, cur = fx;
  const d1 = fxDur(fx);
  if (now - start > d1 && fx.then) { start += d1; cur = fx.then; }
  const left = fxDur(cur) - (now - start);
  if (left < 250) return;
  showFx(el, cur, big, left, cur === fx ? fx.then : null);
}
function showFx(el, fx, big, ms, then) {
  el.innerHTML = fxHTML(fx, big);
  el.className = (big ? 'pj-fx' : 'cr-fx') + ' on' + (fx.kind === 'alert' && big ? ' fx-alert-wrap' : '');
  if (fx.kind === 'reveal' || (fx.kind === 'sold' && fx.data && fx.data.reveal)) scramble(el, fx.kind === 'sold' ? 150 : 250);
  clearTimeout(el._t);
  el._t = setTimeout(() => { if (then && S.fx && !S.fx.dismissed) showFx(el, then, big, fxDur(then), null); else hideFx(el); }, ms);
}
function hideFx(el) {
  clearTimeout(el._t);
  el.classList.remove('on');
  setTimeout(() => { if (!el.classList.contains('on')) el.innerHTML = ''; }, 300);
}
function scramble(root, delay) {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-scramble]').forEach(el => {
    const target = el.dataset.scramble;
    if (reduce) { el.textContent = target; return; }
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#?%&@';
    const t0 = performance.now() + delay, dur = 1300;
    const step = now => {
      const k = clamp((now - t0) / dur, 0, 1), n = Math.floor(k * target.length);
      let s = target.slice(0, n);
      for (let i = n; i < target.length; i++) s += target[i] === ' ' ? ' ' : chars[Math.floor(Math.random() * chars.length)];
      el.textContent = s;
      if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = target;
    };
    requestAnimationFrame(step);
  });
}

function tagFromText(s) {
  const k = normKey(s);

}
function rowsToPlayers(rows) {
  const head = rows[0].map(normKey), map = {};
  for (const [f, al] of Object.entries(COLS)) { const i = head.findIndex(h => al.includes(h)); if (i >= 0) map[f] = i; }
  const out = [], warn = [];
  if (map.name == null) return { out, warn: ['No “Name” column was found. Check that the first row has column names.'], map };
  const lakhCol = map.base != null && /(l|lakh|lakhs)$/.test(head[map.base]);
  let n = 0;
  S.players.forEach(p => { const m = String(p.id).match(/(\d+)/); if (m) n = Math.max(n, +m[1]); });
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const g = f => (map[f] != null ? String(row[map[f]] ?? '').trim() : '');
    const name = g('name');
    if (!name) continue;
    let role = parseRole(g('role'));
    if (!role) { if (g('role')) warn.push(`Row ${r + 1}: role “${g('role')}” not recognised, set to Batter.`); role = 'BAT'; }
    const catTxt = g('category').toLowerCase();
    const category = /marquee|icon|star/.test(catTxt) ? 'Marquee' : /uncap/.test(catTxt) ? 'Uncapped' : 'Capped';
    const osTxt = g('overseas');
    const overseas = /overseas|foreign/.test(catTxt) || truthy(osTxt) || (!!osTxt && !/^(n|no|false|0|india|indian|domestic|local|-)$/i.test(osTxt));
    const sp = g('special').toLowerCase();
    const mystery = truthy(g('mystery')) || /myst/.test(sp);
    const wild = truthy(g('wild')) || /wild/.test(sp);
    let base = lakhCol ? Math.round(parseFloat(g('base'))) : parseMoney(g('base'), { guessLakhs: true });
    if (base == null || !isFinite(base)) { if (g('base')) warn.push(`Row ${r + 1}: base price “${g('base')}” not understood, set to ${money(cr2l(0.5))}.`); base = cr2l(0.5); }
    let id = g('id');
    if (!id) id = 'P' + String(++n).padStart(3, '0');
    else if (/^\d+$/.test(id)) id = 'P' + id.padStart(3, '0');
    const photo = /^(https?:|data:image)/i.test(g('photo')) ? g('photo') : '';
    const p = newPlayer({
      id, name, role, bat: /^(l|lh|left)/i.test(g('bat')) ? 'Left Hand' : 'Right Hand', bowl: g('bowl'),
      rating: clamp(parseInt(g('rating'), 10) || 70, 0, 100), base, category, overseas,
      tags: g('tags') ? g('tags').split(/[|;,]/).map(s => s.trim()).filter(Boolean).map(tagFromText) : [],
      mystery: mystery && !wild, wild, clues: g('clues') ? g('clues').split('|').map(s => s.trim()).filter(Boolean) : [], photo,

    out.push(p);
  }
  const ids = new Set();
  out.forEach(p => { if (ids.has(p.id)) warn.push(`Player ID ${p.id} appears more than once; the last row wins.`); ids.add(p.id); });
  return { out, warn, map };
}

async function exportData(ds, fmt) {
  const all = datasets();
  const keys = ds === 'all' ? Object.keys(all) : [ds];
  const base = slugify(S.event.name);
  try {
    if (fmt === 'csv') { const d = all[ds]; return saveFile(`${base}-${ds}.csv`, toCSV([d.head, ...d.rows]), 'text/csv'); }
    if (fmt === 'xlsx') {
      toast('Preparing the Excel file…', 'info');
      await loadLib('xlsx');
      const wb = XLSX.utils.book_new();
      for (const k of keys) {
        const d = all[k];
        const ws = XLSX.utils.aoa_to_sheet([d.head, ...d.rows]);
        ws['!cols'] = d.head.map((h, i) => ({ wch: Math.min(42, Math.max(String(h).length, ...d.rows.slice(0, 300).map(r => String(r[i] ?? '').length)) + 2) }));
        XLSX.utils.book_append_sheet(wb, ws, d.sheet);
      }
      const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      return saveFile(`${base}-${ds === 'all' ? 'everything' : ds}.xlsx`, new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    }
    if (fmt === 'pdf') {
      toast('Preparing the PDF…', 'info');
      await loadLib('jspdf'); await loadLib('autotable');
      return saveFile(`${base}-${ds === 'all' ? 'report' : ds}.pdf`, buildPDF(keys, all, ds === 'all').output('blob'));
    }
  } catch (e) {
    toast(e && e.message === 'offline' ? 'Excel and PDF need an internet connection the first time. CSV works offline.' : 'Export failed: ' + ((e && e.message) || e), 'bad', 6000);
  }
}
function buildPDF(keys, all, full) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  doc.setFillColor(8, 13, 36); doc.rect(0, 0, W, 74, 'F');
  doc.setFillColor(157, 221, 144); doc.rect(0, 74, W, 4, 'F');
  doc.setTextColor(245, 245, 245); doc.setFont('helvetica', 'bold'); doc.setFontSize(22);
  doc.text(stripEmoji(S.event.name || 'Auction') + (full ? ' — Final report' : ''), 36, 44);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  doc.text(stripEmoji([S.event.host, S.event.date, 'Generated ' + new Date().toLocaleString()].filter(Boolean).join('   ·   ')), 36, 62);
  let y = 104;
  const section = title => {
    if (y > H - 120) { doc.addPage(); y = 50; }
    doc.setTextColor(8, 13, 36); doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text(stripEmoji(title), 36, y);
  };
  const table = (head, body) => {
    doc.autoTable({
      startY: y + 8, head: [head.map(stripEmoji)], body: body.map(r => r.map(c => stripEmoji(c))),
      styles: { fontSize: 8, cellPadding: 3, textColor: [20, 22, 40] }, headStyles: { fillColor: [8, 13, 36], textColor: [248, 213, 126], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [245, 245, 245] }, margin: { left: 36, right: 36 },
    });
    y = doc.lastAutoTable.finalY + 28;
  };
  for (const k of keys) {
    const d = all[k];
    if (k === 'squads' && full) {
      for (const t of S.teams) {
        const ti = D().ti[t.id];
        section(`${t.name} — ${ti.count} players · spent ${money(ti.spent, { pdf: true })} · ${money(ti.purse, { pdf: true })} left`);
        const an = ti.an;
        table(['Player', 'Role', 'Price', 'Acquired'], ti.squad.slice().sort((a, b) => b.soldPrice - a.soldPrice).map(p => [p.name + (p.overseas ? ' (overseas)' : ''), ROLE_INFO[p.role].n, money(p.soldPrice, { pdf: true }), p.acq === 'rtm' ? 'RTM' : p.acq === 'direct' ? 'Assigned' : 'Auction']).concat([['Analysis (guide only)', `Strength ${an.strength} · Balance ${an.balance} · Versatility ${an.versatility}`, `Value ${an.value}`, `Bat ${an.batting} · Bowl ${an.bowling} · WK ${an.wk}`]]));
      }
      continue;
    }
    section(d.title);
    table(d.head, d.rows.length ? d.rows : [['None']]);
  }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120, 120, 120); doc.text(`${stripEmoji(S.event.name || '')} · page ${i} of ${pages}`, W - 36, H - 18, { align: 'right' }); }
  return doc;
}

/* ---------- Keyboard ---------- */
function onKey(e) {
  if (!S) return;
  if (MODE === 'projector') { if (e.key === 'f' || e.key === 'F') toggleFullscreen(); return; }
  const field = e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]');
  if (MODAL) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Enter' && MODAL.onEnter && !(field && field.tagName === 'TEXTAREA') && !(field && field.type === 'file')) { e.preventDefault(); MODAL.onEnter(); return; }
    if (!field && MODAL.keys && !e.ctrlKey && !e.metaKey) { const f = MODAL.keys[e.key.toLowerCase()]; if (f) { e.preventDefault(); f(); } }
    return;
  }
  if (field) { if (e.key === 'Escape') field.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === '?') { e.preventDefault(); return openShortcuts(); }
  if (k === 'v' || k === 'V') return toggleProjView();
  if (k === 'f' || k === 'F') return toggleFullscreen();
  if (k === 'Escape') { if (!dismissFx() && UI.projView) toggleProjView(false); return; }
  if (UI.page !== 'control' && !UI.projView) return;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  if (e.code && /^Digit\d$/.test(e.code)) {
    const dgt = +e.code.slice(5);
    let idx = dgt === 0 ? 9 : dgt - 1;
    if (e.shiftKey) idx = dgt >= 1 && dgt <= 5 ? 9 + dgt : -1;
    if (idx >= 0 && S.teams[idx]) { e.preventDefault(); bidTeam(S.teams[idx].id); }
    return;
  }
  switch (k.toLowerCase()) {
    case ' ': spaceBid(); break;
    case 'enter': if (S.live.phase === 'ready') startBidding(); else if (S.live.phase === 'empty' || S.live.phase === 'done') nextPlayer(); break;
    case 's': askSold(); break;
    case 'u': openUnsold(); break;
    case 'r': undoKey(); break;
    case 'n': nextPlayer(); break;
    case 'p': prevPlayer(); break;
    case 'm': mysteryKey(e.shiftKey); break;
    case 'w': openWildDeck(); break;
    case 't': rtmKey(); break;
    case 'c': openCustomBid(); break;
    case 'x': openPass(); break;
    case 'a': openAlerts(); break;
    default: return;
  }
}
function onKeyUp(e) {
  if (e.key === ' ' && !(e.target && e.target.closest && e.target.closest('input,textarea,select'))) e.preventDefault();
}

/* ---------- Lock: only one window runs the auction ---------- */
function showLock(kind) {
  const el = $('#lock');
  el.hidden = false;
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lockT"><header><h2 id="lockT">${kind === 'moved' ? 'CONTROL MOVED' : 'ALREADY OPEN'}</h2></header>
    <div class="m-body"><p>${kind === 'moved' ? 'Another window took control of the auction. This one now only shows it.' : 'This auction is already running in another window or tab. Use that one, or take control here.'}</p>
    <p class="muted">Only one window runs the auction at a time, so no bid is saved twice.</p></div>
    <footer><button class="btn ghost" data-act="lock-view">VIEW ONLY</button><button class="btn blue" data-act="lock-take">TAKE CONTROL HERE</button></footer></div>`;
  paintSave();
}

/* ---------- Shell ---------- */
function buildShell() {
  const nav = [['control', 'Auction'], ['players', 'Players'], ['teams', 'Teams'], ['results', 'Reports'], ['judging', 'Judging'], ['admin', 'Fixes'], ['setup', 'Setup']];
  $('#rail').innerHTML = `<div class="brand">${BALL}<span>AUCTION</span></div>
    ${nav.map(([k, l]) => `<button class="nav" data-act="nav" data-page="${k}" title="${l}">${ICON[k]}<span>${l}</span></button>`).join('')}
    <div class="rail-foot"><button class="nav" data-act="projector-menu" title="Projector">${ICON.projector}<span>Projector</span></button></div>`;
}

/* ---------- Events ---------- */
function wire() {
  document.addEventListener('click', e => {
    SFX.unlock();
    const el = e.target.closest('[data-act]');
    if (!el) {
      if (MODAL && e.target === $('#modal') && MODAL.id !== 'confirm' && MODAL.id !== 'rtm' && MODAL.id !== 'pe' && MODAL.id !== 'import') closeModal();
      return;
    }
    if (el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'BUTTON' && e.detail > 0) el.blur();
    e.preventDefault();
    fn(el.dataset, el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.bind) return bindChange(el);
    if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el);
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && IN[el.dataset.in]) IN[el.dataset.in](el); });
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.parentElement && (t.parentElement.classList.contains('ph') || t.parentElement.classList.contains('logo'))) t.remove(); }, true);
  let drag = null;
  document.addEventListener('dragstart', e => { const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li) return; drag = li.dataset.qpid; li.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag); } catch (x) {} });
  document.addEventListener('dragover', e => {
    const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li || !drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect(), top = e.clientY < r.top + r.height / 2;
    $$('.qi.over-top,.qi.over-bot').forEach(x => x.classList.remove('over-top', 'over-bot'));
    li.classList.add(top ? 'over-top' : 'over-bot');
  });
  document.addEventListener('drop', e => {
    const li = e.target.closest && e.target.closest('[data-qpid]'); if (!li || !drag) return;
    e.preventDefault();
    const r = li.getBoundingClientRect();
    qDrop(drag, li.dataset.qpid, e.clientY < r.top + r.height / 2);
  });
  document.addEventListener('dragend', () => { drag = null; $$('.qi.dragging,.qi.over-top,.qi.over-bot').forEach(x => x.classList.remove('dragging', 'over-top', 'over-bot')); });
  let idleT = null;
  document.addEventListener('mousemove', () => { const pr = $('#proj'); if (!pr) return; pr.classList.remove('idle-mouse'); clearTimeout(idleT); idleT = setTimeout(() => pr.classList.add('idle-mouse'), 2500); });
  if (BC) BC.onmessage = ev => onSync(ev.data || {});
  window.addEventListener('storage', e => {
    if (BC || e.key !== LS_KEY || !e.newValue) return;
    if (MODE === 'projector' || !CONTROLLER) { try { S = migrate(JSON.parse(e.newValue)); render(); } catch (x) {} }
  });
}
let booting = true, otherController = false;
function onSync(m) {
  if (m.from === TAB) return;
  if (m.type === 'state') { if (MODE === 'projector' || !CONTROLLER) { S = migrate(m.state); render(); } }
  else if (m.type === 'media') { MEDIA.set(m.id, m.url); render(); }
  else if (m.type === 'who') { if (MODE === 'control' && CONTROLLER && S) { bcPost({ type: 'here' }); bcPost({ type: 'state', state: S }); } }
  else if (m.type === 'here') { if (MODE === 'control' && booting) otherController = true; }
  else if (m.type === 'takeover') { if (MODE === 'control' && CONTROLLER) { CONTROLLER = false; closeModal(); showLock('moved'); } }
}

async function boot() {
  wire();
  if (MODE === 'projector') { document.body.classList.add('mode-proj'); document.title = 'Projector · ' + document.title; }
  idb = await idbOpen();
  const a = await idbGet('state');
  let b = null;
  try { b = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  const st = a && b ? ((b.updated || 0) > (a.updated || 0) ? b : a) : (a || b);
  const restored = !!(st && Array.isArray(st.players));
  if (restored) S = migrate(st);
  else S = MODE === 'control' ? buildSample() : blankState();
  CK = (await idbGet('ck')) || [];
  for (const [k, v] of await idbEntries()) if (typeof k === 'string' && k.startsWith('m:')) MEDIA.set(k.slice(2), v);
  if (MODE === 'projector') {
    const pr = $('#proj'); pr.hidden = false;
    renderProj();
    bcPost({ type: 'who' });
    setInterval(paintTimer, 250);
    return;
  }
  buildShell();
  nav(UI.page || 'control');
  setInterval(paintTimer, 250);
  bcPost({ type: 'who' });
  setTimeout(() => {
    booting = false;
    if (otherController) { CONTROLLER = false; showLock('open'); return; }
    if (!restored) persist();
    else { saveInfo.at = st.updated || null; paintSave(); toast('✅ Auction restored' + (st.updated ? ', last saved ' + hhmmss(st.updated) : '') + '.', 'good', 4000); }
  }, 400);
}
boot();
